<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdCheck | 레퍼런스 복구</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!-- 개발용 도구.
     이미지는 Blob에 올라갔는데 레퍼런스 목록에서만 빠진 소재를 되찾는다.
     목록을 한 장씩 읽고 고쳐 쓰던 시절에 뒤 저장이 앞 저장을 덮어 생긴다.
     원인은 막았지만 이미 빠진 것은 여기서 되살린다. -->
<style>
:root{color-scheme:dark;--bg:#0b0c0e;--panel:#14171c;--line:#30343b;--ink:#edeef0;--dim:#7e838c;--lime:#c3ff4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 Pretendard,-apple-system,sans-serif;letter-spacing:-.015em;padding:26px;max-width:980px}
h1{font-size:19px;margin:0 0 4px}
p.sub{color:var(--dim);font-size:12.5px;margin:0 0 18px}
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:9px;background:var(--panel);color:var(--ink);border:1px solid var(--line);cursor:pointer}
button.go{background:var(--lime);color:#10120c;border-color:var(--lime)}
button:disabled{opacity:.45;cursor:not-allowed}
pre{font:11.5px/1.75 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#c7ccd4;background:#101317;border:1px solid #23272e;border-radius:10px;padding:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.grid span{display:block;font-size:11px;color:var(--dim);margin-top:4px}
</style>
</head>
<body>
<h1>레퍼런스 복구</h1>
<p class="sub">이미지는 올라갔는데 목록에서만 빠진 소재를 찾아 되살립니다.<br>
   축 태그는 있는데 목록에 없는 것을 단서로 삼습니다.</p>
<pre id="log">확인하는 중…</pre>
<div style="display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;align-items:center">
  <button id="scan">다시 확인</button>
  <button class="go" id="fix" disabled>되살리기</button>
  <button id="drop" disabled>못 찾은 것 버리기</button>
  <button id="fp">지문 채우기</button>
  <input id="hints" placeholder="못 찾은 것의 광고주 이름 (쉼표로 구분)"
    style="flex:1;min-width:260px;font:inherit;padding:9px 12px;border-radius:9px;background:var(--panel);color:var(--ink);border:1px solid var(--line)">
</div>
<p class="sub" style="margin:-4px 0 10px">파일 이름 규칙은 목록에 남아 있는 소재에서 알아냅니다.
  어떤 광고주의 소재가 전부 사라졌으면 그 규칙을 알 수 없습니다. 그 광고주 이름을 여기에 적으면 규칙을 만들어 찾습니다.</p>
<div class="grid" id="grid"></div>

<script type="module">
const $ = s => document.querySelector(s);
const BLOB = 'https://oeiquwo26iglgctf.public.blob.vercel-storage.com';
let found = [];
let missing = [];   // 주소를 되짚지 못한 키. 되살릴 수 없으니 버리거나 다시 담아야 한다.

const CATS = ['beauty','shopping','telecom','fashion','finance','healthcare',
              'electronics','education','food','travel','realestate','gaming','automotive'];

function axesKey(url){
  const name = String(url||'').split('?')[0].split('/').pop() || '';
  const stem = name.replace(/\.[a-z0-9]+$/i,'');
  const tail = stem.split('-').pop();
  return tail && tail.length >= 8 ? tail : stem.slice(-40);
}
async function getJSON(u,o){ const r=await fetch(u,o); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||('HTTP '+r.status)); return d; }
const exists = (u) => fetch(u,{method:'HEAD'}).then(r=>r.ok).catch(()=>false);

async function scan(){
  $('#fix').disabled = true; $('#drop').disabled = true; $('#grid').innerHTML=''; found=[]; missing=[];
  $('#log').textContent = '축 태그와 현재 목록을 비교하는 중…';
  const [axes, all] = await Promise.all([
    getJSON('/api/referenceAxes'),
    getJSON('/api/referenceImages?category=all'),
  ]);
  const have = new Set((all.items||[]).map(x => axesKey(x.thumbUrl)));
  const orphan = Object.keys(axes.items||{}).filter(k => !have.has(k));
  if (!orphan.length) { $('#log').textContent = '빠진 소재가 없습니다.'; return; }

  /* 빠진 것의 주소를 되짚는다. 업로드 파일 이름은
     reference/<업종>/upload-<브랜드슬러그>-thumb-<무작위>.<확장자> 꼴이라,
     이미 목록에 있는 소재들의 업종과 슬러그 조합을 후보로 삼으면 찾힌다. */
  const shapes = new Set();
  (all.items||[]).forEach(x => {
    const m = String(x.thumbUrl||'').match(/\/reference\/([a-z]+)\/(upload-.+?)-thumb-[^/]+\.([a-z0-9]+)$/i);
    // 큐레이션 소재는 파일명이 전부 달라 후보로 삼으면 조합이 수만 건이 된다.
    // 목록에서 빠지는 사고는 업로드 경로에서만 나므로 upload- 로 시작하는 것만 본다.
    if (m) shapes.add(m[1] + '|' + m[2] + '|' + m[3]);
  });
  // 확장자는 mime에서 오므로 몇 가지를 시도한다
  const exts = ['jpeg','jpg','png','webp'];
  /* 사용자가 적어 준 광고주 이름으로도 후보를 만든다. 서버가 파일 이름을
     만드는 규칙(api/uploadReferenceImage.js)과 같은 식으로 슬러그를 만든다. */
  const typed = $('#hints').value.split(',').map(x => x.trim()).filter(Boolean);
  const cats = new Set([...shapes].map(s => s.split('|')[0]));
  if (!cats.size) CATS.forEach(c => cats.add(c));
  typed.forEach((name) => {
    const slug = name.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-+|-+$/g, '') || 'upload';
    cats.forEach(c => shapes.add(c + '|' + encodeURIComponent('upload-' + slug) + '|jpeg'));
  });
  const cands = [];
  shapes.forEach(s => {
    const [cat, slug] = s.split('|');
    exts.forEach(e => cands.push({ cat, slug, e }));
  });
  if (!cands.length) {
    $('#log').textContent = `목록에서 빠진 ${orphan.length}건을 찾았지만, 주소를 되짚을 단서가 없습니다.\n`
      + '업로드로 들어온 소재가 목록에 하나도 남아 있지 않으면 파일 이름 규칙을 알 수 없습니다.';
    return;
  }
  $('#log').textContent = `빠진 ${orphan.length}건 · 후보 주소 ${cands.length}가지를 시도합니다`;

  let n = 0;
  for (const k of orphan) {
    n++;
    $('#log').textContent = `주소를 되짚는 중 ${n} / ${orphan.length} · 찾은 것 ${found.length}`;
    for (const c of cands) {
      const thumbUrl = `${BLOB}/reference/${c.cat}/${c.slug}-thumb-${k}.${c.e}`;
      if (await exists(thumbUrl)) {
        const brand = decodeURIComponent(c.slug.replace(/^upload-/, '')) || '광고주 미상';
        found.push({ key: k, category: c.cat, brandName: brand, thumbUrl, ext: c.e, slug: c.slug });
        break;
      }
    }
  }

  missing = orphan.filter(k => !found.some(f => f.key === k));
  $('#log').textContent = `목록에서 빠진 ${orphan.length}건 중 ${found.length}건의 이미지를 찾았습니다.\n`
    + (found.length ? '되살리면 브랜드와 축 태그는 그대로 붙지만 메모는 비어 있습니다. 메모는 올릴 때만 있던 값이라 복구할 수 없습니다.' : '')
    + (missing.length ? `\n찾지 못한 ${missing.length}건은 다시 담거나, 되살릴 가치가 없으면 버리세요.`
        + '\n검색에 섞여 든 남의 광고면 버리는 쪽이 맞습니다. 버리면 축 태그만 지워지고 이미지는 그대로 남습니다.' : '');
  $('#grid').innerHTML = found.map(f =>
    `<div><img src="${f.thumbUrl}" loading="lazy"><span>${f.brandName} · ${f.category}</span></div>`).join('');
  $('#fix').disabled = !found.length;
  $('#drop').disabled = !missing.length;
}

$('#drop').onclick = async () => {
  if (!missing.length) return;
  if (!confirm(`축 태그 ${missing.length}건을 지웁니다.\n되살릴 수 없는 것만 버리세요. 이미지 자체는 지워지지 않습니다.`)) return;
  $('#drop').disabled = true;
  try {
    const r = await getJSON('/api/referenceAxes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ remove: missing }),
    });
    $('#log').textContent = `${r.removed}건을 버렸습니다. 축 태그 전체 ${r.total}건.`;
    missing = [];
  } catch (e) {
    $('#log').textContent = '버리지 못했습니다: ' + (e.message || e);
    $('#drop').disabled = false;
  }
};

$('#fix').onclick = async () => {
  $('#fix').disabled = true;
  /* 원본 주소는 썸네일과 같은 꼴에 thumb만 full로 바뀐다. 없으면 썸네일을 쓴다.
     지금은 둘 다 같은 600px 이미지라 어느 쪽이든 보이는 것은 같다. */
  const items = [];
  for (const f of found) {
    const fullUrl = f.thumbUrl.replace('-thumb-', '-full-');
    items.push({
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
      category: f.category, brandName: f.brandName,
      mimeType: 'image/' + (f.ext === 'jpg' ? 'jpeg' : f.ext),
      thumbUrl: f.thumbUrl,
      fullUrl: (await exists(fullUrl)) ? fullUrl : f.thumbUrl,
      uploadedAt: new Date().toISOString(),
      recovered: true,
    });
  }
  try {
    const r = await getJSON('/api/uploadReferenceImage', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ register: items }),
    });
    $('#log').textContent = `${r.added}건을 되살렸습니다. 레퍼런스 전체 ${r.total}건.`;
  } catch (e) {
    $('#log').textContent = '되살리지 못했습니다: ' + (e.message || e);
    $('#fix').disabled = false;
  }
};

/* 지문 채우기.
   광고 담기가 지문을 저장하기 전에 담은 소재는 지문이 없다. 지문이 없으면
   다음에 같은 브랜드를 다시 담을 때 이미 있는 것을 가려내지 못해 그대로
   중복이 쌓인다. 이미지가 공개 주소에 있으니 여기서 다시 계산해 채운다.
   AI 호출이 아니라 픽셀 계산이라 돈이 들지 않는다. */
function dHash(bm) {
  /* 광고 담기(assets/adcheck-ads.js)의 hashOf와 반드시 같은 값을 내야 한다.
     축소를 drawImage에 맡기면 캔버스 옵션에 따라 17비트까지 벌어진다(실측).
     1:1로 그려 픽셀을 그대로 읽고 9x8 평균은 직접 낸다. */
  const cv = document.createElement('canvas');
  cv.width = bm.width; cv.height = bm.height;
  const cx = cv.getContext('2d');
  cx.drawImage(bm, 0, 0);
  const d = cx.getImageData(0, 0, bm.width, bm.height).data;
  const W = 9, H = 8, g = new Float64Array(W * H), n = new Float64Array(W * H);
  for (let y = 0; y < bm.height; y++) {
    const gy = Math.min(H - 1, (y * H / bm.height) | 0);
    for (let x = 0; x < bm.width; x++) {
      const gx = Math.min(W - 1, (x * W / bm.width) | 0);
      const i = (y * bm.width + x) * 4, k = gy * W + gx;
      g[k] += d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      n[k]++;
    }
  }
  let bits = '';
  for (let y = 0; y < H; y++) for (let x = 0; x < W - 1; x++) {
    bits += (g[y * W + x] / n[y * W + x]) > (g[y * W + x + 1] / n[y * W + x + 1]) ? '1' : '0';
  }
  return bits;
}

$('#fp').onclick = async () => {
  $('#fp').disabled = true;
  try {
    const all = await getJSON('/api/referenceImages?category=all');
    // 업로드로 들어온 소재만 대상이다. 큐레이션 소재는 광고 담기와 겹치지 않는다.
    const need = (all.items || []).filter(x => /\/upload-/.test(x.thumbUrl || '') && !x.hash);
    if (!need.length) { $('#log').textContent = '지문이 빠진 소재가 없습니다.'; $('#fp').disabled = false; return; }
    const out = [];
    for (let i = 0; i < need.length; i++) {
      $('#log').textContent = `지문 계산 ${i + 1} / ${need.length}`;
      try {
        const r = await fetch(need[i].thumbUrl);
        if (!r.ok) continue;
        const bm = await createImageBitmap(await r.blob());
        out.push({ thumbUrl: need[i].thumbUrl, hash: dHash(bm) });
        bm.close && bm.close();
      } catch (e) { /* 한 장 실패해도 계속 */ }
    }
    const res = await getJSON('/api/uploadReferenceImage', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ register: out }),
    });
    $('#log').textContent = `지문 ${out.length}건을 채웠습니다 (갱신 ${res.updated}건).`
      + (out.length < need.length ? `\n${need.length - out.length}건은 이미지를 받지 못했습니다.` : '');
  } catch (e) {
    $('#log').textContent = '지문을 채우지 못했습니다: ' + (e.message || e);
  }
  $('#fp').disabled = false;
};

$('#scan').onclick = scan;
scan().catch(e => { $('#log').textContent = '오류: ' + (e.message || e) + '\n배포본에서 열어야 합니다.'; });
</script>
</body>
</html>
