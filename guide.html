<!DOCTYPE html>
<html lang="ko" data-seq-reveal>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdCheck | 브랜드 가이드</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0C0E;
    --surface: #14171C;
    --surface-2: #0F1216;
    --surface-3: #15181D;
    --line: rgba(255,255,255,.11);
    --line-soft: rgba(255,255,255,.07);
    --ink: #EDEEF0;
    --ink-2: #A2A7B0;
    --ink-3: #7E838C;
    --ink-4: #6B707A;
    --accent: #C3FF4D;
    --accent-strong: #B8E600;
    --accent-ink: #0B0C0E;
    --card: #14171C;
    --card-border: rgba(255,255,255,.11);
    --text: #EDEEF0;
    --text-2: #A2A7B0;
    --text-3: #7E838C;
    --canvas-text: #EDEEF0;
    --canvas-text-2: #A2A7B0;
    --charcoal: #15181D;
    --charcoal-border: rgba(255,255,255,.11);
    --num-bg: rgba(204,255,0,.1);
    --num-text: #CCFF00;
    --pass: #00A371;
    --needsfix: #F7A900;
    --reject: #F22F6B;
    --na: #6B707A;
    --danger: #C2687A;
    --ok: #A8CFBC;
    --font-display: 'Sora','Pretendard',sans-serif;
    --font-mono: 'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  /* 첫 페인트 전부터 숨겨서 반짝임(FOUC) 방지 — adcheck-reveal.js가 이후 트랜지션을 붙인다.
     자바스크립트가 죽어도 콘텐츠가 영영 안 보이는 사고가 없도록 noscript로 되돌린다. */
  html.js [data-row],html.js [data-reveal]{opacity:0;}

  html{scrollbar-gutter:stable;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-x:hidden;
  }
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button,input,select,textarea{font-family:inherit;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  .grain{position:fixed; inset:0; z-index:600; pointer-events:none; background-image:url(assets/grain.svg); background-size:180px 180px; opacity:.09; mix-blend-mode:overlay;}

  .page{max-width:1180px; margin:0 auto; padding:120px 40px 100px;}

  .gnb-bar{position:fixed; top:0; left:0; right:0; z-index:200; padding:14px 40px 0; background:linear-gradient(180deg,#0B0C0E 74%,rgba(11,12,14,.86)); backdrop-filter:blur(10px);}
  .gnb-bar-inner{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; max-width:1520px; margin:0 auto; gap:20px;}
  .gnb-logo{display:flex; align-items:center; justify-self:start; text-decoration:none;}
  .gnb-logo-icon{height:40px; width:auto; display:block;}
  .gnb-logo-text{display:none;}
  .gnb{display:flex; align-items:center;}
  .gnb-primary{gap:2px; justify-self:center; padding:6px; border-radius:999px; background:rgba(18,21,25,.9); backdrop-filter:blur(18px) saturate(1.2); border:1px solid rgba(255,255,255,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -26px rgba(0,0,0,.95);}
  .gnb-secondary{gap:2px; justify-self:end;}
  .gnb-primary .gnb-link{font-size:13px; font-weight:500; color:var(--ink-2); padding:9px 15px; border-radius:999px; text-decoration:none; letter-spacing:-.015em; white-space:nowrap; border:none; background:none; cursor:pointer; transition:background .25s ease,color .25s ease,box-shadow .25s ease;}
  .gnb-primary .gnb-link:hover{color:var(--ink); box-shadow:inset 0 0 0 1px rgba(204,255,0,.55);}
  .gnb-primary .gnb-link.active{background:#EDEEF0; color:#0B0C0E; font-weight:700;}
  .gnb-primary .gnb-link.active:hover{box-shadow:none;}
  .gnb-secondary .gnb-link{font-size:12.5px; font-weight:500; color:var(--ink-3); padding:9px 12px; text-decoration:none; white-space:nowrap; transition:color .25s ease;}
  .gnb-secondary .gnb-link:hover{color:var(--ink);}
  .gnb-secondary .gnb-link.active{color:#EDEEF0;}
  .gnb-dropdown{position:relative;}
  .gnb-dropdown-toggle{display:flex; align-items:center; gap:5px; font-family:inherit;}
  .gnb-dropdown-toggle::after{content:'\25BC'; font-size:8px; opacity:.55;}
  .gnb-dropdown-menu{position:absolute; top:100%; left:50%; transform:translateX(-50%); padding-top:12px; display:none; z-index:40;}
  .gnb-dropdown-menu-inner{padding:8px; border-radius:16px; background:rgba(20,23,28,.98); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.14); box-shadow:0 26px 54px -20px rgba(0,0,0,.95); min-width:158px; display:flex; flex-direction:column; gap:2px;}
  .gnb-dropdown:hover .gnb-dropdown-menu, .gnb-dropdown:focus-within .gnb-dropdown-menu, .gnb-dropdown-menu.open{display:block;}
  .gnb-dropdown-item{display:block; width:100%; text-align:left; font-size:12.5px; font-weight:500; color:var(--ink-2); padding:10px 12px; border-radius:9px; white-space:nowrap; text-decoration:none; transition:background .2s ease,color .2s ease;}
  .gnb-dropdown-item:hover{color:var(--ink); background:rgba(255,255,255,.07);}
  .gnb-dropdown-item.active{color:var(--accent); background:rgba(204,255,0,.1);}

  .scroll-progress{max-width:1520px; margin:14px auto 0; height:1px; background:rgba(255,255,255,.07); border-radius:1px; overflow:hidden;}
  .scroll-progress-bar{height:1px; width:0%; background:linear-gradient(90deg,var(--accent),var(--ink));}



  /* ---------- 푸터 로고 ---------- */
  .footer-logo{display:block; height:36px; width:auto; margin:0 auto 18px; opacity:.5;}

  .page-eyebrow{font:500 11px/1 var(--font-mono); letter-spacing:.2em; color:var(--ink-3); margin-bottom:22px;}
  .page-eyebrow b{color:var(--accent); font-weight:500;}
  h1{font-family:var(--font-display); font-size:clamp(36px,4.6vw,68px); font-weight:800; letter-spacing:-.055em; line-height:1; margin:0; color:var(--ink);}
  .sub{margin:24px 0 44px; max-width:78ch; font-size:16.5px; font-weight:300; line-height:1.85; color:var(--ink-2);}

  .bg-sidebar{display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; align-items:start;}
  .bg-side-label{font:500 10px/1 var(--font-mono); letter-spacing:.18em; color:var(--ink-4); margin-bottom:10px;}
  .bg-side-list{display:flex; flex-direction:column; gap:2px; margin-bottom:18px;}
  .bg-side-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; border-radius:10px; border:none; background:none; color:var(--ink-2); font-size:13.5px; font-weight:500; cursor:pointer; text-align:left; width:100%; font-family:inherit; transition:background .2s ease,color .2s ease;}
  .bg-side-item:hover{background:rgba(255,255,255,.05); color:var(--ink);}
  .bg-side-item.active{background:rgba(204,255,0,.12); color:var(--accent); font-weight:700;}
  .bg-side-item .bg-side-count{font-size:12px; font-weight:400; color:var(--ink-4);}
  
  .brand-add-row{display:flex; gap:8px; margin-bottom:6px;}
  .brand-add-row input{flex:1; min-width:0; padding:11px 14px; border:1px solid var(--charcoal-border); border-radius:10px; font-size:13.5px; font-family:inherit; background:var(--charcoal); color:var(--canvas-text);}
  .brand-add-btn{border:1.5px solid rgba(204,255,0,.5); background:rgba(204,255,0,.06); color:var(--accent); border-radius:12px; padding:12px 16px; cursor:pointer; font-size:13px; font-weight:700; flex-shrink:0; font-family:inherit; white-space:nowrap; transition:background .2s ease,border-color .2s ease;}
  .brand-add-btn:hover{background:rgba(204,255,0,.12); border-color:rgba(204,255,0,.75);}
  .brand-add-btn:hover{opacity:0.85;}
  .brand-add-status{font-size:12px; min-height:14px; margin-bottom:4px;}
  .brand-add-status.error{color:var(--danger);}
  .brand-add-status.ok{color:var(--ok);}

  .bg-card{background:var(--card); box-shadow:none; border:1px solid rgba(255,255,255,.11); border-radius:20px; padding:28px 30px; margin-bottom:16px;}
  .brand-head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .brand-head{display:flex; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .brand-name{font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-.02em;}
  .brand-count{font-size:12px; color:var(--ink-4); white-space:nowrap;}
  .brand-note{font-size:13px; color:var(--text-2); margin-top:8px;}

  .btn-row{display:flex; gap:8px; flex-shrink:0;}
  .edit-btn{font-size:12.5px; font-weight:700; border:none; border-radius:20px; padding:8px 16px; cursor:pointer; white-space:nowrap; font-family:inherit;}
  .edit-btn:hover{opacity:0.85;}
  .edit-btn.save{color:var(--accent-ink); background:var(--accent);}
  .edit-btn.danger{color:var(--reject); background:rgba(194,104,122,.13);}

  .bg-panel-head{display:flex; align-items:baseline; gap:10px; padding-bottom:14px; margin-bottom:16px; border-bottom:1px solid var(--line-soft);}
  .bg-panel-label{font:700 10px/1 var(--font-mono); letter-spacing:.14em; color:var(--accent);}
  .bg-panel-title{font-size:15px; font-weight:700; color:var(--ink);}
  .bg-panel-meta{margin-left:auto; font-size:12px; color:var(--ink-4); font-family:var(--font-mono); white-space:nowrap;}

  .spec-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px;}
  .spec-card{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:rgba(255,255,255,.03);}
  .spec-card-label{font-size:11.5px; color:var(--ink-3); margin-bottom:4px;}
  .spec-card-value{font-size:14px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}

  .gl-empty{font-size:13.5px; color:var(--ink-4); background:rgba(255,255,255,.03); border-radius:10px; padding:16px 18px;}

  .toggle-section{margin-bottom:16px;}
  .toggle-section:last-child{margin-bottom:0;}
  .toggle-row{display:flex; align-items:center; gap:14px; padding:9px 2px; font-size:13.5px; color:var(--ink-2); cursor:pointer;}
  .toggle-row.on{color:var(--ink);}
  .toggle-switch{position:relative; flex-shrink:0; width:36px; height:20px;}
  .toggle-switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
  .toggle-track{position:absolute; inset:0; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid var(--line); transition:background .2s ease,border-color .2s ease;}
  .toggle-track::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--ink-3); transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s ease;}
  .toggle-switch input:checked + .toggle-track{background:var(--accent); border-color:var(--accent);}
  .toggle-switch input:checked + .toggle-track::after{transform:translateX(16px); background:var(--accent-ink);}

  .feedback-list{list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px;}
  .feedback-row{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--ink-2); padding:6px 2px;}
  .feedback-row-date{flex:0 0 60px; font-family:var(--font-mono); font-weight:600; color:var(--ink-4); white-space:nowrap;}
  .feedback-row-text{flex:1; color:var(--ink-2); line-height:1.6;}
  .feedback-remove, .field-remove{border:none; background:rgba(255,255,255,.06); color:var(--ink-3); width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:15px; flex-shrink:0; line-height:1; display:flex; align-items:center; justify-content:center;}
  .feedback-remove:hover, .field-remove:hover{background:rgba(194,104,122,.18); color:var(--reject);}

  .feedback-add-row{display:flex; gap:8px; margin-top:8px;}
  .feedback-add-row input{flex:1; min-width:0; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:13px; font-family:inherit; background:var(--surface-2); color:var(--ink);}
  .feedback-add-btn{border:none; background:var(--accent); color:var(--accent-ink); border-radius:10px; padding:0 18px; cursor:pointer; font-size:13px; font-weight:700; flex-shrink:0; font-family:inherit;}

  .field-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .field-row input{padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:13px; font-family:inherit; background:var(--surface-2); color:var(--ink);}
  .field-row .field-label{flex:0 0 42%;}
  .field-row .field-value{flex:1; min-width:0;}
  .add-field-btn{font-size:12.5px; color:var(--accent); background:none; border:1.5px dashed rgba(204,255,0,.4); border-radius:10px; padding:10px 12px; cursor:pointer; width:100%; margin-top:4px; font-family:inherit;}
  .add-field-btn:hover{background:rgba(204,255,0,.06);}
  .field-note{margin-left:auto; font-size:11px; color:var(--ink-4);}

  .save-status{font-size:12.5px; margin-top:14px; min-height:16px;}
  .save-status.error{color:var(--reject);}
  .save-status.ok{color:var(--pass);}

  .page-footer{text-align:center; font:400 11.5px/1.9 'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; letter-spacing:normal; color:var(--ink-4); padding-top:60px; margin-top:40px; border-top:1px solid var(--line-soft);}

  .loading-msg{font-size:13.5px; color:var(--ink-4); padding:20px 0;}
  .gallery-loading{font-size:12.5px; color:var(--ink-4); margin-bottom:8px;}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px;}
  .gallery-item{display:block; border-radius:10px; overflow:hidden; box-shadow:none; border:1px solid rgba(255,255,255,.11); background:rgba(255,255,255,.045); aspect-ratio:1; transition:transform .15s ease, box-shadow .15s ease; padding:0; cursor:pointer; width:100%;}
  .gallery-item:hover{transform:translateY(-2px); box-shadow:3px 5px 30px rgba(0,0,0,0.22);}
  .gallery-item img{width:100%; height:100%; object-fit:cover; display:block;}

  .lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; align-items:center; justify-content:center; padding:40px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .lightbox img[src=""]{display:none;}
  .lightbox-close{position:absolute; top:24px; right:28px; background:none; border:none; color:var(--ink); font-size:32px; line-height:1; cursor:pointer; padding:8px;}

  @media (max-width:900px){
    .bg-sidebar{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .page{padding:28px 18px 70px;}
    .bg-card{padding:22px 20px;}
    .gnb-bar-inner{display:flex; flex-wrap:wrap; gap:14px;}
    .gnb{gap:12px;}
    .field-row{flex-wrap:wrap;}
    .field-row .field-label{flex:1 1 100%;}
  }

  /* ================= 인터랙션 디벨롭 (2026-08) — index.html 과 공유 =================
     아래 블록과 문서 끝의 대응 스크립트만 걷어내면 이전 상태로 돌아갑니다. */
  /* ---- 히어로 진입 모션 (index.html 과 동일한 감각) ---- */
  @keyframes pageFadeUp{from{opacity:0; transform:translateY(22px);}to{opacity:1; transform:none;}}
  .page-eyebrow{animation:pageFadeUp .7s cubic-bezier(.16,1,.3,1) .04s both;}
  .page > h1, h1{animation:pageFadeUp .8s cubic-bezier(.16,1,.3,1) .12s both;}
  .page > .sub, .sub{animation:pageFadeUp .85s cubic-bezier(.16,1,.3,1) .22s both;}
  @media (prefers-reduced-motion:reduce){
    .page-eyebrow, .page > h1, h1, .page > .sub, .sub{animation:none; opacity:1; transform:none;}
  }


  /* ---- 플로팅 라운드 GNB ---- */
  .gnb-bar{
    top:14px; padding:0 40px; background:none; backdrop-filter:none;
    transition:top .4s cubic-bezier(.2,.8,.2,1), opacity .3s ease, transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .gnb-bar-inner{
    padding:8px 10px 8px 18px; border-radius:999px;
    background:rgba(16,19,23,.72); backdrop-filter:blur(18px) saturate(1.3);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 18px 44px -26px rgba(0,0,0,.9);
    transition:background-color .45s ease, border-color .45s ease, box-shadow .45s ease;
  }
  .gnb-logo-icon{height:30px;}
  .gnb-primary{background:none; border:none; box-shadow:none; backdrop-filter:none; padding:0; gap:6px;}
  .gnb-bar.hide-nav{opacity:0; transform:translateY(-130%); pointer-events:none;}

  /* 메뉴 항목: 테두리 없이 초록만 */
  .gnb-primary .gnb-link{border:none; box-shadow:none; transition:color .25s ease, background-color .3s ease;}
  .gnb-primary .gnb-link:hover{color:#CCFF00; background:rgba(204,255,0,.10); box-shadow:none;}
  .gnb-primary .gnb-link.active,
  .gnb-primary .gnb-link.active:hover{background:#CCFF00; color:#0B0C0E; box-shadow:none;}

  /* 스크롤 진행선은 화면 최상단으로 */
  .scroll-progress{
    position:fixed; top:0; left:0; right:0; z-index:210;
    max-width:none; margin:0; height:2px; background:none; border-radius:0;
  }
  .scroll-progress-bar{height:2px;}

  /* ---- 드롭다운: 부드럽게 열리기 ---- */
  .gnb-dropdown-menu{
    display:block; opacity:0; visibility:hidden;
    transform:translateX(-50%) translateY(-7px) scale(.97); transform-origin:top center;
    transition:opacity .26s cubic-bezier(.2,.8,.2,1), transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s;
  }
  .gnb-dropdown:hover .gnb-dropdown-menu,
  .gnb-dropdown:focus-within .gnb-dropdown-menu,
  .gnb-dropdown-menu.open{
    display:block; opacity:1; visibility:visible;
    transform:translateX(-50%) translateY(0) scale(1);
    transition:opacity .26s cubic-bezier(.2,.8,.2,1), transform .34s cubic-bezier(.16,1,.3,1), visibility 0s;
  }
  .gnb-dropdown-toggle::after{transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s ease;}
  .gnb-dropdown:hover .gnb-dropdown-toggle::after{transform:rotate(180deg); opacity:.9;}
  .gnb-dropdown-item{transition:background-color .2s ease, color .2s ease, transform .28s cubic-bezier(.2,.8,.2,1);}
  .gnb-dropdown:hover .gnb-dropdown-item{animation:ddItem .38s cubic-bezier(.16,1,.3,1) both;}
  .gnb-dropdown-item:nth-child(2){animation-delay:.04s;}
  .gnb-dropdown-item:nth-child(3){animation-delay:.08s;}
  .gnb-dropdown-item:nth-child(4){animation-delay:.12s;}
  .gnb-dropdown-item:hover{transform:translateX(3px);}
  @keyframes ddItem{from{opacity:0; transform:translateY(-6px);}to{opacity:1; transform:none;}}

  /* ---- 푸터: 한 화면 가득, 내용은 위 / 저작권은 바닥 ---- */
  .page-footer{
    position:relative;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    margin:0; padding:96px 40px 40px; border-top:none;
    background:#0B0C0E;
  }
  /* 다크 페이지라 별도 배경 블리드 없이 컨테이너만 넓힌다 (가로 스크롤 방지) */
  .page-footer{width:100vw; margin-left:calc(50% - 50vw);}
  .footer-logo{height:38px; margin:0 0 16px; opacity:.42;}
  .footer-copy{margin-top:auto; padding-top:60px; opacity:.6;}

  @media (max-width:760px){
    .gnb-bar{padding:0 14px;}
    .gnb-bar-inner{padding:7px 9px 7px 14px;}
    .page-footer{padding:64px 18px;}
    .footer-logo{height:30px;}
  }
</style>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>

<div class="grain"></div>

<div class="gnb-bar">
  <div class="gnb-bar-inner">
    <a href="index.html" class="gnb-logo"><img src="assets/logo-wordmark.png" alt="AdCheck" class="gnb-logo-icon"><span class="gnb-logo-text">AdCheck</span></a>

<div class="page">

  <div class="page-eyebrow"><b>&#10022;</b>&nbsp;BRAND GUIDE</div>

  <h1>브랜드 가이드</h1>
  <p class="sub">브랜드별 기준을 팀이 체크리스트로 편집하면, 배너 분석 시 AI가 그대로 참고합니다.</p>

  <div class="bg-sidebar">
    <div>
      <div class="bg-side-label">ADVERTISERS</div>
      <div class="bg-side-list" id="brandSideList"></div>
      <div class="brand-add-row">
        <input type="text" id="newBrandInput" placeholder="새 브랜드 이름 (예: 롯데카드)">
      </div>
      <button type="button" id="addBrandBtn" class="brand-add-btn" style="width:100%;">+ 브랜드 추가</button>
      <div class="brand-add-status" id="brandAddStatus"></div>
    </div>

    <div id="brandDetail" data-stagger>
      <div class="loading-msg">브랜드 가이드를 불러오는 중…</div>
    </div>

    이 결과는 법적 효력이 없으며, 이로 인해 발생하는 문제에 대해 어떠한 책임도 지지 않습니다.<br>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="닫기">&times;</button>
  <img id="lightboxImg" src="" alt="확대된 참고 배너">
</div>

<script>
  document.querySelectorAll('.gnb-dropdown-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = btn.nextElementSibling;
      document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  const SECTIONS = [
    { key: 'color', title: '브랜드 컬러' },
    { key: 'vi', title: '브랜드 VI (로고 / 타이포)' },
    { key: 'usp', title: 'USP 전략 / 배너 유형별 기준' },
    { key: 'asset', title: '이미지·소재 활용' },
    { key: 'mood', title: '브랜드 아이덴티티 · 톤앤무드' },
    { key: 'quality', title: '디자인 퀄리티 기준' },
  ];

  const brandSideList = document.getElementById('brandSideList');
  const brandDetail = document.getElementById('brandDetail');
  let brandsData = [];
  let checklistOptions = [];
  let currentBrandId = null;
  let currentDraft = null; // 항상 편집 가능한 작업본 — 브랜드를 바꿀 때만 서버 데이터로 다시 복제됨

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  function openLightbox(fullSrc){
    lightbox.classList.add('show');
    lightboxImg.src = fullSrc;
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

  // 브랜드를 바꿔 카드를 새로 그린 뒤 등장 모션을 다시 걸어준다
  function bindReveal(){
    if(window.adcheckReveal) setTimeout(window.adcheckReveal, 0);
  }

  function cloneDraft(b){
    const d = JSON.parse(JSON.stringify(b));
    if(!d.checklist) d.checklist = {};
    if(!d.customFields) d.customFields = [];
    if(!d.feedbackLog) d.feedbackLog = [];
    return d;
  }

  function renderSidebar(){
    const rows = [];
    brandsData.forEach(b => {
      rows.push('<button type="button" class="bg-side-item' + (b.id === currentBrandId ? ' active' : '') + '" data-brand-id="' + escapeHtml(b.id) + '">' +
        escapeHtml(b.name) + '<span class="bg-side-count">' + (b.imageCount || 0) + '</span></button>');
    });
    brandSideList.innerHTML = rows.join('');
    brandSideList.querySelectorAll('.bg-side-item').forEach(btn => {
      btn.addEventListener('click', () => selectBrand(btn.dataset.brandId || null));
    });
  }

  function selectBrand(id){
    currentBrandId = id || null;
    const b = brandsData.find(x => x.id === currentBrandId);
    currentDraft = b ? cloneDraft(b) : null;
    renderSidebar();
    renderDetail();
  }

  // 토글·필드·피드백 입력을 DOM에서 읽어 currentDraft에 반영 —
  // 구조가 바뀌는 동작(추가/삭제/저장) 직전에 호출해 다른 행의 입력값을 잃지 않는다.
  function syncDraftFromDom(){
    if(!currentDraft) return;
    const checklist = {};
    document.querySelectorAll('[data-check-id]').forEach(cb => {
      checklist[cb.dataset.checkId] = cb.checked;
    });
    currentDraft.checklist = checklist;

    const rows = document.querySelectorAll('#fieldRows .field-row');
    currentDraft.customFields = Array.from(rows).map(row => ({
      label: row.querySelector('.field-label').value,
      value: row.querySelector('.field-value').value,
    }));
  }

  function renderDetail(){
    const d = currentDraft;
    if(!d){ brandDetail.innerHTML = ''; return; }
    const countLabel = '참고 배너 ' + (d.imageCount || 0) + '장 · 체크리스트 ' + checklistOptions.filter(o => d.checklist[o.id]).length + '항목';

    const feedbackRows = d.feedbackLog.length
      ? d.feedbackLog.map((f, i) => i).reverse().map(i => {
          const f = d.feedbackLog[i];
          return '<div class="feedback-row" data-feedback-index="' + i + '">' +
            '<span class="feedback-row-date">' + escapeHtml(f.date) + '</span>' +
            '<span class="feedback-row-text">' + escapeHtml(f.text) + '</span>' +
            '<button type="button" class="feedback-remove" aria-label="삭제">&times;</button>' +
          '</div>';
        }).join('')
      : '<div class="gl-empty">등록된 피드백이 없습니다.</div>';

    const fieldsHtml = d.customFields.map((f, i) =>
      '<div class="field-row" data-field-index="' + i + '">' +
        '<input type="text" class="field-label" placeholder="항목명 (예: Primary 컬러)" value="' + escapeHtml(f.label) + '">' +
        '<input type="text" class="field-value" placeholder="값 (예: #FA2993)" value="' + escapeHtml(f.value) + '">' +
        '<button type="button" class="field-remove" aria-label="삭제">&times;</button>' +
      '</div>'
    ).join('');

    const checklistHtml = SECTIONS.map(sec => {
      const items = checklistOptions.filter(o => o.section === sec.key);
      if(!items.length) return '';
      const onCount = items.filter(o => d.checklist[o.id]).length;
      const rows = items.map(o => {
        const checked = !!d.checklist[o.id];
        return '<label class="toggle-row' + (checked ? ' on' : '') + '">' +
          '<span class="toggle-switch"><input type="checkbox" data-check-id="' + escapeHtml(o.id) + '"' + (checked ? ' checked' : '') + '><span class="toggle-track"></span></span>' +
          escapeHtml(o.label) +
        '</label>';
      }).join('');
      return '<div class="bg-card toggle-section" data-row>' +
        '<div class="bg-panel-head"><span class="bg-panel-label">' + escapeHtml(sec.key.toUpperCase()) + '</span><span class="bg-panel-title">' + escapeHtml(sec.title) + '</span><span class="bg-panel-meta">' + onCount + ' / ' + items.length + '</span></div>' +
        rows +
      '</div>';
    }).join('');

    const galleryHtml = (d.imageCount > 0)
      ? '<div class="bg-card" data-row><div class="bg-panel-head"><span class="bg-panel-label">REFERENCE</span><span class="bg-panel-title">참고 배너</span></div><div class="gallery-loading">이미지를 불러오는 중…</div><div class="gallery" id="gallery-' + d.id + '"></div></div>'
      : '';

    brandDetail.innerHTML =
      '<div class="bg-card" data-row>' +
        '<div class="brand-head-row">' +
          '<div class="brand-head"><span class="brand-name">' + escapeHtml(d.name) + '</span></div>' +
          '<div class="btn-row">' +
            '<button type="button" class="edit-btn danger" id="deleteBrandBtn">삭제</button>' +
            '<button type="button" class="edit-btn save" id="saveEditBtn">변경사항 저장</button>' +
          '</div>' +
        '</div>' +
        '<div class="brand-count">' + escapeHtml(countLabel) + '</div>' +
        (d.note ? '<div class="brand-note">' + escapeHtml(d.note) + '</div>' : '') +
      '</div>' +

      '<div class="bg-card" data-row>' +
        '<div class="bg-panel-head"><span class="bg-panel-label">FEEDBACK</span><span class="bg-panel-title">광고주 피드백</span><span class="bg-panel-meta">' + d.feedbackLog.length + '건</span></div>' +
        '<div id="feedbackRows" class="feedback-list">' + feedbackRows + '</div>' +
        '<div class="feedback-add-row"><input type="text" id="newFeedbackInput" placeholder="새 피드백 내용을 입력하고 추가"><button type="button" class="feedback-add-btn" id="addFeedbackBtn">추가</button></div>' +
      '</div>' +

      '<div class="bg-card" data-row>' +
        '<div class="bg-panel-head"><span class="bg-panel-label">FIELDS</span><span class="bg-panel-title">커스텀 필드</span><span class="bg-panel-meta">컬러 코드처럼 직접 입력이 필요한 값</span></div>' +
        '<div id="fieldRows">' + fieldsHtml + '</div>' +
        '<button type="button" class="add-field-btn" id="addFieldBtn">+ 필드 추가</button>' +
      '</div>' +

      checklistHtml +
      galleryHtml +
      '<div class="save-status" id="saveStatus"></div>';

    document.getElementById('deleteBrandBtn').addEventListener('click', () => deleteBrand(d));
    document.getElementById('saveEditBtn').addEventListener('click', saveDraft);

    document.getElementById('addFieldBtn').addEventListener('click', () => {
      syncDraftFromDom();
      currentDraft.customFields.push({ label: '', value: '' });
      renderDetail();
    });
    document.getElementById('fieldRows').addEventListener('click', (e) => {
      const row = e.target.closest('.field-row');
      if(row && e.target.classList.contains('field-remove')){
        syncDraftFromDom();
        currentDraft.customFields.splice(parseInt(row.dataset.fieldIndex, 10), 1);
        renderDetail();
      }
    });

    document.getElementById('addFeedbackBtn').addEventListener('click', () => {
      const input = document.getElementById('newFeedbackInput');
      const text = input.value.trim();
      if(!text) return;
      syncDraftFromDom();
      currentDraft.feedbackLog.push({ date: new Date().toISOString().slice(0, 10), text });
      renderDetail();
    });
    document.getElementById('feedbackRows').addEventListener('click', (e) => {
      const row = e.target.closest('.feedback-row');
      if(row && e.target.classList.contains('feedback-remove')){
        syncDraftFromDom();
        currentDraft.feedbackLog.splice(parseInt(row.dataset.feedbackIndex, 10), 1);
        renderDetail();
      }
    });

    if(d.imageCount > 0) loadBrandImages(d.id);
    bindReveal();
  }

  function saveDraft(){
    syncDraftFromDom();
    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return; // cancelled the prompt

    const statusEl = document.getElementById('saveStatus');
    statusEl.textContent = '저장 중…';
    statusEl.className = 'save-status';

    fetch('/api/saveBrandGuideState', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: currentDraft.id,
        checklist: currentDraft.checklist,
        customFields: currentDraft.customFields.filter(f => f.label && f.value),
        feedbackLog: currentDraft.feedbackLog,
        editPassword: password,
      }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          statusEl.textContent = data.error || '저장에 실패했습니다.';
          statusEl.className = 'save-status error';
          return;
        }
        loadBrandsData(currentBrandId);
      })
      .catch(() => {
        statusEl.textContent = '저장 중 오류가 발생했습니다. 다시 시도해주세요.';
        statusEl.className = 'save-status error';
      });
  }

  function loadBrandImages(id){
    fetch('/api/brandImages?id=' + encodeURIComponent(id))
      .then(r => {
        if(!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(data => {
        if(currentBrandId !== id) return; // user switched brands while this was loading
        const loadingEl = brandDetail.querySelector('.gallery-loading');
        const galleryEl = document.getElementById('gallery-' + id);
        if(loadingEl) loadingEl.remove();
        if(!galleryEl) return;
        const images = data.images || [];
        if(images.length === 0){
          galleryEl.outerHTML = '<div class="gl-empty">등록된 참고 배너 이미지를 불러오지 못했습니다.</div>';
          return;
        }
        images.forEach((img, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'gallery-item';
          btn.innerHTML = '<img src="' + img.thumbUrl + '" alt="참고 배너 ' + (i + 1) + '" loading="lazy">';
          btn.addEventListener('click', () => openLightbox(img.fullUrl));
          galleryEl.appendChild(btn);
        });
      })
      .catch(() => {
        if(currentBrandId !== id) return;
        const loadingEl = brandDetail.querySelector('.gallery-loading');
        if(loadingEl) loadingEl.textContent = '참고 배너 이미지를 불러오지 못했습니다.';
      });
  }

  function loadBrandsData(selectId){
    return fetch('/api/brandGuides')
      .then(r => {
        if(!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(data => {
        brandsData = data.brands || [];
        if(brandsData.length === 0){
          brandSideList.innerHTML = '';
          brandDetail.innerHTML = '<div class="gl-empty">등록된 브랜드가 없습니다.</div>';
          return;
        }
        const wanted = selectId || currentBrandId;
        currentBrandId = (wanted && brandsData.some(b => b.id === wanted)) ? wanted : brandsData[0].id;
        selectBrand(currentBrandId);
      });
  }

  function addNewBrand(){
    const input = document.getElementById('newBrandInput');
    const statusEl = document.getElementById('brandAddStatus');
    const name = input.value.trim();
    if(!name){
      statusEl.textContent = '브랜드 이름을 입력해주세요.';
      statusEl.className = 'brand-add-status error';
      return;
    }
    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return; // cancelled the prompt

    statusEl.textContent = '추가하는 중…';
    statusEl.className = 'brand-add-status';

    fetch('/api/advertisers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, editPassword: password }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          statusEl.textContent = data.error || '추가에 실패했습니다.';
          statusEl.className = 'brand-add-status error';
          return;
        }
        input.value = '';
        statusEl.textContent = '"' + name + '" 브랜드가 추가됐습니다.';
        statusEl.className = 'brand-add-status ok';
        const newId = data.brand && data.brand.id;
        loadBrandsData(newId);
      })
      .catch(() => {
        statusEl.textContent = '추가 중 오류가 발생했습니다. 다시 시도해주세요.';
        statusEl.className = 'brand-add-status error';
      });
  }

  document.getElementById('addBrandBtn').addEventListener('click', addNewBrand);

  function deleteBrand(b){
    const warning = b.isCustom
      ? ('"' + b.name + '" 브랜드를 삭제할까요? 등록된 체크리스트·피드백 내용도 함께 사라집니다.')
      : ('"' + b.name + '" 브랜드를 목록에서 삭제할까요?' + (b.imageCount > 0 ? ' 등록된 참고 배너 ' + b.imageCount + '장은 보관되지만 더 이상 노출되지 않습니다.' : '') + ' (코드로 등록된 브랜드라 복원이 필요하면 Claude에게 요청해주세요)');
    if(!window.confirm(warning)) return;
    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return; // cancelled the prompt

    fetch('/api/advertisers', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: b.id, editPassword: password }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          window.alert(data.error || '삭제에 실패했습니다.');
          return;
        }
        currentBrandId = null;
        loadBrandsData();
      })
      .catch(() => {
        window.alert('삭제 중 오류가 발생했습니다. 다시 시도해주세요.');
      });
  }

  function loadChecklistOptions(){
    return fetch('/api/brandGuideChecklistOptions')
      .then(r => r.json())
      .then(data => { checklistOptions = data.items || []; });
  }

  Promise.all([loadChecklistOptions(), loadBrandsData()])
    .catch(() => {
      brandDetail.innerHTML = '<div class="gl-empty">브랜드 가이드를 불러오지 못했습니다. API가 배포되었는지 확인해주세요.</div>';
    });

  // 헤더 하단 스크롤 진행 바
  (function(){
    const bar = document.getElementById('scrollProgress');
    if(!bar) return;
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>
<script src="assets/adcheck-reveal.js?v=5"></script>

<script>
/* ===== 인터랙션 디벨롭 (2026-08) — 푸터에서 GNB 감추기 (index.html 과 공유) ===== */
(function () {
  var gnb = document.querySelector('.gnb-bar');
  var footer = document.querySelector('.page-footer');
  if (!gnb || !footer) return;
  var raf = null;

  function frame() {
    raf = null;
    var y = window.scrollY, vh = window.innerHeight;
    var fr = footer.getBoundingClientRect();
    gnb.classList.toggle('hide-nav', y > 120 && fr.top > 0 && fr.top < vh && fr.bottom <= vh + 2);
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(frame); }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  if (window.ResizeObserver) new ResizeObserver(schedule).observe(document.body);
  [400, 1200, 2500].forEach(function (ms) { setTimeout(schedule, ms); });
  frame();
})();
</script>
