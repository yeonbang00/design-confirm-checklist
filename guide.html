<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdCheck | 브랜드 가이드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0C0E;
    --surface: #14171C;
    --surface-2: #0F1216;
    --surface-3: #15181D;
    --line: rgba(255,255,255,.11);
    --line-soft: rgba(255,255,255,.07);
    --ink: #EDEEF0;
    --ink-2: #A2A7B0;
    --ink-3: #7E838C;
    --ink-4: #6B707A;
    --accent: #CCFF00;
    --accent-strong: #B8E600;
    --accent-ink: #0B0C0E;
    --card: #14171C;
    --card-border: rgba(255,255,255,.11);
    --text: #EDEEF0;
    --text-2: #A2A7B0;
    --text-3: #7E838C;
    --canvas-text: #EDEEF0;
    --canvas-text-2: #A2A7B0;
    --charcoal: #15181D;
    --charcoal-border: rgba(255,255,255,.11);
    --num-bg: rgba(204,255,0,.1);
    --num-text: #CCFF00;
    --pass: #A8CFBC;
    --needsfix: #D9A660;
    --reject: #C2687A;
    --na: #6B707A;
    --danger: #C2687A;
    --ok: #A8CFBC;
    --font-display: 'Sora','Pretendard',sans-serif;
    --font-mono: 'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html{scrollbar-gutter:stable;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-x:hidden;
  }
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button,input,select,textarea{font-family:inherit;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  .grain{position:fixed; inset:0; z-index:600; pointer-events:none; background-image:url(assets/grain.svg); background-size:180px 180px; opacity:.09; mix-blend-mode:overlay;}

  .page{max-width:1180px; margin:0 auto; padding:120px 40px 100px;}

  .gnb-bar{position:fixed; top:0; left:0; right:0; z-index:200; padding:14px 40px 0; background:linear-gradient(180deg,#0B0C0E 74%,rgba(11,12,14,.86)); backdrop-filter:blur(10px);}
  .gnb-bar-inner{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; max-width:1520px; margin:0 auto; gap:20px;}
  .gnb-logo{display:flex; align-items:center; justify-self:start; text-decoration:none;}
  .gnb-logo-icon{height:22px; width:auto; display:block;}
  .gnb-logo-text{display:none;}
  .gnb{display:flex; align-items:center;}
  .gnb-primary{gap:2px; justify-self:center; padding:6px; border-radius:999px; background:rgba(18,21,25,.9); backdrop-filter:blur(18px) saturate(1.2); border:1px solid rgba(255,255,255,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -26px rgba(0,0,0,.95);}
  .gnb-secondary{gap:2px; justify-self:end;}
  .gnb-primary .gnb-link{font-size:13px; font-weight:500; color:var(--ink-2); padding:9px 15px; border-radius:999px; text-decoration:none; letter-spacing:-.015em; white-space:nowrap; border:none; background:none; cursor:pointer; transition:background .25s ease,color .25s ease,box-shadow .25s ease;}
  .gnb-primary .gnb-link:hover{color:var(--ink); box-shadow:inset 0 0 0 1px rgba(204,255,0,.55);}
  .gnb-primary .gnb-link.active{background:#EDEEF0; color:#0B0C0E; font-weight:700;}
  .gnb-primary .gnb-link.active:hover{box-shadow:none;}
  .gnb-secondary .gnb-link{font-size:12.5px; font-weight:500; color:var(--ink-3); padding:9px 12px; text-decoration:none; white-space:nowrap; transition:color .25s ease;}
  .gnb-secondary .gnb-link:hover{color:var(--ink);}
  .gnb-secondary .gnb-link.active{color:#EDEEF0;}
  .gnb-dropdown{position:relative;}
  .gnb-dropdown-toggle{display:flex; align-items:center; gap:5px; font-family:inherit;}
  .gnb-dropdown-toggle::after{content:'\25BC'; font-size:8px; opacity:.55;}
  .gnb-dropdown-menu{position:absolute; top:100%; left:50%; transform:translateX(-50%); padding-top:12px; display:none; z-index:40;}
  .gnb-dropdown-menu-inner{padding:8px; border-radius:16px; background:rgba(20,23,28,.98); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.14); box-shadow:0 26px 54px -20px rgba(0,0,0,.95); min-width:158px; display:flex; flex-direction:column; gap:2px;}
  .gnb-dropdown:hover .gnb-dropdown-menu, .gnb-dropdown:focus-within .gnb-dropdown-menu, .gnb-dropdown-menu.open{display:block;}
  .gnb-dropdown-item{display:block; width:100%; text-align:left; font-size:12.5px; font-weight:500; color:var(--ink-2); padding:10px 12px; border-radius:9px; white-space:nowrap; text-decoration:none; transition:background .2s ease,color .2s ease;}
  .gnb-dropdown-item:hover{color:var(--ink); background:rgba(255,255,255,.07);}
  .gnb-dropdown-item.active{color:var(--accent);}


  /* ---------- 등장 모션 (assets/motion.js) ---------- */
  html.motion-ready [data-reveal]{opacity:0; transform:translateY(30px); transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1);}
  html.motion-ready [data-reveal].in{opacity:1; transform:translateY(0);}
  html.motion-ready [data-row]{opacity:0; transform:translateX(-40px); transition:opacity .7s ease, transform .8s cubic-bezier(.16,1,.3,1);}
  html.motion-ready [data-row].in{opacity:1; transform:translateX(0);}
  html.motion-ready [data-row][data-dir="down"]{transform:translateY(-22px);}
  html.motion-ready [data-row][data-dir="down"].in{transform:translateY(0);}

  /* ---------- 푸터 로고 ---------- */
  .footer-logo{display:block; height:20px; width:auto; margin:0 auto 18px; opacity:.5;}

  .page-eyebrow{font:500 11px/1 var(--font-mono); letter-spacing:.2em; color:var(--ink-3); margin-bottom:22px;}
  .page-eyebrow b{color:var(--accent); font-weight:500;}
  h1{font-family:var(--font-display); font-size:clamp(36px,4.6vw,68px); font-weight:800; letter-spacing:-.055em; line-height:1; margin:0; color:var(--ink);}
  .sub{margin:24px 0 44px; max-width:78ch; font-size:16.5px; font-weight:300; line-height:1.85; color:var(--ink-2);}

  .select-wrap{position:relative; margin-bottom:12px; max-width:420px;}
  .select-wrap select{
    width:100%; appearance:none; background:var(--charcoal); border:1px solid var(--charcoal-border);
    border-radius:10px; padding:13px 40px 13px 16px; font-size:14.5px; font-weight:600; color:var(--canvas-text); cursor:pointer;
  }
  .select-wrap svg{position:absolute; right:16px; top:50%; transform:translateY(-50%); pointer-events:none;}

  .brand-add-row{display:flex; gap:8px; max-width:420px; margin-bottom:6px;}
  .brand-add-row input{flex:1; padding:11px 14px; border:1px solid var(--charcoal-border); border-radius:10px; font-size:13.5px; font-family:inherit; background:var(--charcoal); color:var(--canvas-text);}
  .brand-add-btn{border:none; background:var(--accent); color:var(--accent-ink); border-radius:10px; padding:0 16px; cursor:pointer; font-size:13px; font-weight:700; flex-shrink:0; font-family:inherit; white-space:nowrap;}
  .brand-add-btn:hover{opacity:0.85;}
  .brand-add-status{font-size:12px; max-width:420px; min-height:14px; margin-bottom:22px;}
  .brand-add-status.error{color:var(--danger);}
  .brand-add-status.ok{color:var(--ok);}

  .brand-card{background:var(--card); box-shadow:none; border:1px solid rgba(255,255,255,.11); border-radius:20px; padding:32px;}
  .brand-head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .brand-head{display:flex; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .brand-name{font-size:19px; font-weight:700;}
  .brand-count{font-size:12px; color:var(--text-3); white-space:nowrap;}
  .brand-note{font-size:13px; color:var(--text-2); margin-bottom:20px;}

  .btn-row{display:flex; gap:8px; flex-shrink:0;}
  .edit-btn{font-size:12.5px; font-weight:700; color:var(--num-text); background:var(--num-bg); border:none; border-radius:20px; padding:8px 16px; cursor:pointer; white-space:nowrap; font-family:inherit;}
  .edit-btn:hover{opacity:0.85;}
  .edit-btn.cancel{color:var(--text-2); background:rgba(255,255,255,.045);}
  .edit-btn.save{color:var(--accent-ink); background:var(--accent);}
  .edit-btn.danger{color:var(--danger); background:rgba(194,104,122,.13);}

  .spec-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:22px;}
  .spec-card{border:1.5px solid var(--num-text); border-radius:14px; padding:14px 16px; background:var(--num-bg);}
  .spec-card-label{font-size:11.5px; color:var(--text-2); margin-bottom:4px;}
  .spec-card-value{font-size:14px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums;}

  .gl-empty{font-size:13.5px; color:var(--text-3); background:rgba(255,255,255,.045); border-radius:10px; padding:16px 18px;}
  .gl-heading{font-size:13px; font-weight:700; color:var(--num-text); background:var(--num-bg); border-radius:8px; padding:8px 12px; margin:18px 0 10px;}
  .gl-heading:first-child{margin-top:0;}

  .checked-list{margin:0 0 6px; padding-left:20px;}
  .checked-list li{font-size:14px; line-height:1.9; color:var(--text);}

  .feedback-list{list-style:none; margin:0 0 22px; padding:0; display:flex; flex-direction:column; gap:8px;}
  .feedback-item{font-size:13px; line-height:1.7; color:var(--text-2); background:rgba(255,255,255,.045); border-radius:10px; padding:10px 14px;}
  .feedback-date{font-weight:700; color:var(--text); margin-right:6px;}

  .edit-section{margin-bottom:8px;}
  .edit-section-title{font-size:13px; font-weight:700; color:var(--num-text); background:var(--num-bg); border-radius:8px; padding:8px 12px; margin-bottom:8px;}
  .check-row{display:flex; align-items:flex-start; gap:10px; padding:7px 2px; font-size:13.5px; color:var(--text); cursor:pointer;}
  .check-row input{margin-top:3px; width:16px; height:16px; accent-color:var(--num-text); cursor:pointer; flex-shrink:0;}

  .feedback-edit-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .feedback-edit-row .feedback-edit-date{flex:0 0 88px; font-size:12px; font-weight:700; color:var(--text); white-space:nowrap;}
  .feedback-edit-row .feedback-edit-text{flex:1; padding:9px 12px; border:1px solid rgba(255,255,255,.14); border-radius:8px; font-size:13px; font-family:inherit; background:var(--card);}
  .field-row{display:flex; gap:8px; margin-bottom:8px;}
  .field-row input{padding:9px 12px; border:1px solid rgba(255,255,255,.14); border-radius:8px; font-size:13px; font-family:inherit; background:var(--card);}
  .field-row .field-label{flex:0 0 150px;}
  .field-row .field-value{flex:1;}
  .field-remove{border:none; background:rgba(194,104,122,.13); color:var(--danger); width:34px; border-radius:8px; cursor:pointer; font-size:16px; flex-shrink:0;}
  .add-field-btn{font-size:12.5px; color:var(--num-text); background:none; border:1.5px dashed var(--num-text); border-radius:8px; padding:9px 12px; cursor:pointer; width:100%; margin-bottom:18px; font-family:inherit;}

  .feedback-add-row{display:flex; gap:8px; margin:10px 0 28px;}
  .feedback-add-row input{flex:1; padding:9px 12px; border:1px solid rgba(255,255,255,.14); border-radius:8px; font-size:13px; font-family:inherit; background:var(--card);}
  .feedback-add-btn{border:none; background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:0 16px; cursor:pointer; font-size:13px; font-weight:700; flex-shrink:0; font-family:inherit;}

  .save-status{font-size:12.5px; margin-top:16px; min-height:16px;}
  .save-status.error{color:var(--danger);}
  .save-status.ok{color:var(--ok);}

  .page-footer{text-align:center; font-size:12px; color:var(--canvas-text-2); line-height:1.8; padding-top:28px;}

  .loading-msg{font-size:13.5px; color:var(--text-3); padding:20px 0;}
  .gallery-loading{font-size:12.5px; color:var(--text-3); margin-bottom:8px;}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px;}
  .gallery-item{display:block; border-radius:10px; overflow:hidden; box-shadow:none; border:1px solid rgba(255,255,255,.11); background:rgba(255,255,255,.045); aspect-ratio:1; transition:transform .15s ease, box-shadow .15s ease; padding:0; cursor:pointer; width:100%;}
  .gallery-item:hover{transform:translateY(-2px); box-shadow:3px 5px 30px rgba(0,0,0,0.22);}
  .gallery-item img{width:100%; height:100%; object-fit:cover; display:block;}

  .lightbox{display:none; position:fixed; inset:0; background:rgba(29,29,31,0.85); z-index:100; align-items:center; justify-content:center; padding:40px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .lightbox img[src=""]{display:none;}
  .lightbox-close{position:absolute; top:24px; right:28px; background:none; border:none; color:var(--surface); font-size:32px; line-height:1; cursor:pointer; padding:8px;}

  @media (max-width:640px){
    .page{padding:28px 18px 70px;}
    .brand-card{padding:22px 20px;}
    .gnb-bar-inner{display:flex; flex-wrap:wrap; gap:14px;}
    .gnb{gap:12px;}
    .select-wrap{max-width:none;}
    .field-row{flex-wrap:wrap;}
    .field-row .field-label{flex:1 1 100%;}
  }
</style>
</head>
<body>

<div class="grain"></div>

<div class="gnb-bar">
  <div class="gnb-bar-inner">
    <a href="index.html" class="gnb-logo"><img src="assets/logo-wordmark.png" alt="AdCheck" class="gnb-logo-icon"><span class="gnb-logo-text">AdCheck</span></a>
    <nav class="gnb gnb-primary">
      <a href="index.html" class="gnb-link">디자인 체크리스트</a>
      <div class="gnb-dropdown">
        <button type="button" class="gnb-link gnb-dropdown-toggle active">가이드</button>
        <div class="gnb-dropdown-menu"><div class="gnb-dropdown-menu-inner">
          <a href="criteria-guide.html" class="gnb-dropdown-item">항목가이드</a>
          <a href="guide.html" class="gnb-dropdown-item active">브랜드가이드</a>
          <a href="media-guide.html" class="gnb-dropdown-item">매체가이드</a>
          <a href="color-guide.html" class="gnb-dropdown-item">컬러가이드</a>
        </div></div>
      </div>
      <a href="brief-helper.html" class="gnb-link">기획안 헬퍼</a>
      <a href="reference-board.html" class="gnb-link">이미지 레퍼런스</a>
      </nav>
      <nav class="gnb gnb-secondary">
        <a href="history.html" class="gnb-link">히스토리</a>
      <a href="roadmap.html" class="gnb-link">업데이트</a>
    </nav>
  </div>
</div>

<div class="page">

  <div class="page-eyebrow"><b>&#10022;</b>&nbsp;&nbsp;BRAND GUIDE</div>

  <h1>브랜드 가이드</h1>
  <p class="sub">체크리스트에 등록된 브랜드별 디자인 가이드입니다.<br>체크리스트와 필드는 팀이 직접 편집하면서 계속 고도화할 수 있고, 여기 내용은 배너를 분석할 때 AI가 참고하는 기준과 그대로 연결되어 있습니다.</p>

  <div class="select-wrap">
    <select id="brandSelect">
      <option value="">브랜드를 선택하세요</option>
    </select>
    <svg width="14" height="9" viewBox="0 0 14 9"><path d="M1 1L7 7L13 1" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </div>

  <div class="brand-add-row">
    <input type="text" id="newBrandInput" placeholder="새 브랜드 이름 (예: 롯데카드)">
    <button type="button" id="addBrandBtn" class="brand-add-btn">+ 브랜드 추가</button>
  </div>
  <div class="brand-add-status" id="brandAddStatus"></div>

  <div id="brandDetail">
    <div class="loading-msg">브랜드 가이드를 불러오는 중…</div>
  </div>

  <div class="page-footer">
    <img src="assets/logo-wordmark.png" alt="AdCheck" class="footer-logo">
    이 페이지는 팀이 직접 편집합니다. 편집 저장에는 공유 비밀번호가 필요해요.
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="닫기">&times;</button>
  <img id="lightboxImg" src="" alt="확대된 참고 배너">
</div>

<script>
  document.querySelectorAll('.gnb-dropdown-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = btn.nextElementSibling;
      document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  const SECTIONS = [
    { key: 'color', title: '브랜드 컬러' },
    { key: 'vi', title: '브랜드 VI (로고 / 타이포)' },
    { key: 'usp', title: 'USP 전략 / 배너 유형별 기준' },
    { key: 'asset', title: '이미지·소재 활용' },
    { key: 'mood', title: '브랜드 아이덴티티 · 톤앤무드' },
    { key: 'quality', title: '디자인 퀄리티 기준' },
  ];

  const brandSelect = document.getElementById('brandSelect');
  const brandDetail = document.getElementById('brandDetail');
  let brandsData = [];
  let checklistOptions = [];
  let currentBrandId = null;
  let editMode = false;
  let editingDraft = null;

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  function openLightbox(fullSrc){
    lightbox.classList.add('show');
    lightboxImg.src = fullSrc;
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

  function render(){
    if(editMode && editingDraft){ renderEdit(); return; }
    const b = brandsData.find(x => x.id === currentBrandId);
    if(!b){ brandDetail.innerHTML = ''; return; }
    renderView(b);
  }

  function renderView(b){
    const countLabel = b.imageCount > 0 ? ('참고 배너 ' + b.imageCount + '장 등록됨') : '참고 배너 없음';

    const checkedLabels = checklistOptions
      .filter(o => b.checklist && b.checklist[o.id])
      .map(o => o.label);
    const checkedHtml = checkedLabels.length
      ? '<div class="gl-heading">체크된 가이드 기준</div><ul class="checked-list">' + checkedLabels.map(l => '<li>' + escapeHtml(l) + '</li>').join('') + '</ul>'
      : '<div class="gl-empty">아직 체크된 가이드 기준이 없습니다. "편집"을 눌러 채워보세요.</div>';

    const specHtml = (b.customFields && b.customFields.length)
      ? '<div class="spec-grid">' + b.customFields.map(s =>
          '<div class="spec-card"><div class="spec-card-label">' + escapeHtml(s.label) + '</div><div class="spec-card-value">' + escapeHtml(s.value) + '</div></div>'
        ).join('') + '</div>'
      : '';

    const feedbackHtml = (b.feedbackLog && b.feedbackLog.length)
      ? '<div class="gl-heading">광고주 피드백 이력</div><ul class="feedback-list">' + b.feedbackLog.slice().reverse().map(f =>
          '<li class="feedback-item"><span class="feedback-date">' + escapeHtml(f.date) + '</span>' + escapeHtml(f.text) + '</li>'
        ).join('') + '</ul>'
      : '';

    const galleryHtml = b.imageCount > 0
      ? '<div class="gl-heading">참고 배너</div><div class="gallery-loading">이미지를 불러오는 중…</div><div class="gallery" id="gallery-' + b.id + '"></div>'
      : '';

    brandDetail.innerHTML =
      '<div class="brand-card" data-reveal>' +
      '<div class="brand-head-row">' +
        '<div class="brand-head"><span class="brand-name">' + escapeHtml(b.name) + '</span>' +
        '<span class="brand-count">' + escapeHtml(countLabel) + '</span></div>' +
        '<div class="btn-row">' +
          '<button type="button" class="edit-btn danger" id="deleteBrandBtn">삭제</button>' +
          '<button type="button" class="edit-btn" id="editToggleBtn">편집</button>' +
        '</div>' +
      '</div>' +
      (b.note ? '<div class="brand-note">' + escapeHtml(b.note) + '</div>' : '') +
      feedbackHtml +
      checkedHtml +
      specHtml +
      galleryHtml +
      '</div>';

    document.getElementById('deleteBrandBtn').addEventListener('click', () => deleteBrand(b));

    document.getElementById('editToggleBtn').addEventListener('click', enterEdit);
    if(b.imageCount > 0) loadBrandImages(b.id);
  }

  function enterEdit(){
    const b = brandsData.find(x => x.id === currentBrandId);
    if(!b) return;
    // Deep clone so in-progress edits never touch brandsData until saved —
    // "취소" just discards editingDraft and re-renders from the pristine data.
    editingDraft = JSON.parse(JSON.stringify(b));
    if(!editingDraft.checklist) editingDraft.checklist = {};
    if(!editingDraft.customFields) editingDraft.customFields = [];
    if(!editingDraft.feedbackLog) editingDraft.feedbackLog = [];
    editMode = true;
    render();
  }

  // Reads the current DOM (checkboxes + custom field rows) back into
  // editingDraft before any action that re-renders the edit form, so
  // typed-but-unsaved values in other rows aren't lost.
  function syncEditStateFromDom(){
    const checklist = {};
    document.querySelectorAll('[data-check-id]').forEach(cb => {
      checklist[cb.dataset.checkId] = cb.checked;
    });
    editingDraft.checklist = checklist;

    const rows = document.querySelectorAll('#fieldRows .field-row');
    editingDraft.customFields = Array.from(rows).map(row => ({
      label: row.querySelector('.field-label').value,
      value: row.querySelector('.field-value').value,
    }));

    document.querySelectorAll('#feedbackRows .feedback-edit-row').forEach(row => {
      const idx = parseInt(row.dataset.feedbackIndex, 10);
      const text = row.querySelector('.feedback-edit-text').value;
      if(editingDraft.feedbackLog[idx]) editingDraft.feedbackLog[idx].text = text;
    });
  }

  function renderEdit(){
    const d = editingDraft;

    const checklistHtml = SECTIONS.map(sec => {
      const items = checklistOptions.filter(o => o.section === sec.key);
      if(!items.length) return '';
      const rows = items.map(o => {
        const checked = !!d.checklist[o.id];
        return '<label class="check-row"><input type="checkbox" data-check-id="' + escapeHtml(o.id) + '"' + (checked ? ' checked' : '') + '>' + escapeHtml(o.label) + '</label>';
      }).join('');
      return '<div class="edit-section"><div class="edit-section-title">' + escapeHtml(sec.title) + '</div>' + rows + '</div>';
    }).join('');

    const fieldsHtml = d.customFields.map((f, i) =>
      '<div class="field-row" data-field-index="' + i + '">' +
        '<input type="text" class="field-label" placeholder="항목명 (예: Primary 컬러)" value="' + escapeHtml(f.label) + '">' +
        '<input type="text" class="field-value" placeholder="값 (예: #FA2993)" value="' + escapeHtml(f.value) + '">' +
        '<button type="button" class="field-remove" aria-label="삭제">&times;</button>' +
      '</div>'
    ).join('');

    const feedbackHtml = d.feedbackLog.length
      ? d.feedbackLog.map((f, i) => i).reverse().map(i => {
          const f = d.feedbackLog[i];
          return '<div class="feedback-edit-row" data-feedback-index="' + i + '">' +
            '<span class="feedback-edit-date">' + escapeHtml(f.date) + '</span>' +
            '<input type="text" class="feedback-edit-text" value="' + escapeHtml(f.text) + '">' +
            '<button type="button" class="field-remove" aria-label="삭제">&times;</button>' +
          '</div>';
        }).join('')
      : '<div class="gl-empty">등록된 피드백이 없습니다.</div>';

    brandDetail.innerHTML =
      '<div class="brand-card" data-reveal>' +
      '<div class="brand-head-row">' +
        '<div class="brand-head"><span class="brand-name">' + escapeHtml(d.name) + ' — 편집 중</span></div>' +
        '<div class="btn-row"><button type="button" class="edit-btn cancel" id="cancelEditBtn">취소</button><button type="button" class="edit-btn save" id="saveEditBtn">저장</button></div>' +
      '</div>' +
      '<div class="gl-heading">광고주 피드백</div>' +
      '<div id="feedbackRows">' + feedbackHtml + '</div>' +
      '<div class="feedback-add-row"><input type="text" id="newFeedbackInput" placeholder="새 피드백 내용을 입력하고 추가"><button type="button" class="feedback-add-btn" id="addFeedbackBtn">추가</button></div>' +
      '<div class="gl-heading">커스텀 필드 (컬러 코드처럼 직접 입력이 필요한 값)</div>' +
      '<div id="fieldRows">' + fieldsHtml + '</div>' +
      '<button type="button" class="add-field-btn" id="addFieldBtn">+ 필드 추가</button>' +
      checklistHtml +
      '<div class="save-status" id="saveStatus"></div>' +
      '</div>';

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      editMode = false;
      editingDraft = null;
      render();
    });

    document.getElementById('addFieldBtn').addEventListener('click', () => {
      syncEditStateFromDom();
      editingDraft.customFields.push({ label: '', value: '' });
      renderEdit();
    });

    document.getElementById('fieldRows').addEventListener('click', (e) => {
      const row = e.target.closest('.field-row');
      if(row && e.target.classList.contains('field-remove')){
        syncEditStateFromDom();
        const idx = parseInt(row.dataset.fieldIndex, 10);
        editingDraft.customFields.splice(idx, 1);
        renderEdit();
      }
    });

    document.getElementById('addFeedbackBtn').addEventListener('click', () => {
      const input = document.getElementById('newFeedbackInput');
      const text = input.value.trim();
      if(!text) return;
      syncEditStateFromDom();
      editingDraft.feedbackLog.push({ date: new Date().toISOString().slice(0, 10), text });
      renderEdit();
    });

    document.getElementById('feedbackRows').addEventListener('click', (e) => {
      const row = e.target.closest('.feedback-edit-row');
      if(row && e.target.classList.contains('field-remove')){
        syncEditStateFromDom();
        const idx = parseInt(row.dataset.feedbackIndex, 10);
        editingDraft.feedbackLog.splice(idx, 1);
        renderEdit();
      }
    });

    document.getElementById('saveEditBtn').addEventListener('click', saveDraft);
  }

  function saveDraft(){
    syncEditStateFromDom();
    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return; // cancelled the prompt

    const statusEl = document.getElementById('saveStatus');
    statusEl.textContent = '저장 중…';
    statusEl.className = 'save-status';

    fetch('/api/saveBrandGuideState', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: editingDraft.id,
        checklist: editingDraft.checklist,
        customFields: editingDraft.customFields.filter(f => f.label && f.value),
        feedbackLog: editingDraft.feedbackLog,
        editPassword: password,
      }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          statusEl.textContent = data.error || '저장에 실패했습니다.';
          statusEl.className = 'save-status error';
          return;
        }
        editMode = false;
        editingDraft = null;
        loadBrandsData(currentBrandId);
      })
      .catch(() => {
        statusEl.textContent = '저장 중 오류가 발생했습니다. 다시 시도해주세요.';
        statusEl.className = 'save-status error';
      });
  }

  function loadBrandImages(id){
    fetch('/api/brandImages?id=' + encodeURIComponent(id))
      .then(r => {
        if(!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(data => {
        if(currentBrandId !== id) return; // user switched brands while this was loading
        const loadingEl = brandDetail.querySelector('.gallery-loading');
        const galleryEl = document.getElementById('gallery-' + id);
        if(loadingEl) loadingEl.remove();
        if(!galleryEl) return;
        const images = data.images || [];
        if(images.length === 0){
          galleryEl.outerHTML = '<div class="gl-empty">등록된 참고 배너 이미지를 불러오지 못했습니다.</div>';
          return;
        }
        images.forEach((img, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'gallery-item';
          btn.innerHTML = '<img src="' + img.thumbUrl + '" alt="참고 배너 ' + (i + 1) + '" loading="lazy">';
          btn.addEventListener('click', () => openLightbox(img.fullUrl));
          galleryEl.appendChild(btn);
        });
      })
      .catch(() => {
        if(currentBrandId !== id) return;
        const loadingEl = brandDetail.querySelector('.gallery-loading');
        if(loadingEl) loadingEl.textContent = '참고 배너 이미지를 불러오지 못했습니다.';
      });
  }

  brandSelect.addEventListener('change', () => {
    editMode = false;
    editingDraft = null;
    if(brandSelect.value){ currentBrandId = brandSelect.value; render(); }
    else { currentBrandId = null; brandDetail.innerHTML = ''; }
  });

  function loadBrandsData(selectId){
    return fetch('/api/brandGuides')
      .then(r => {
        if(!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(data => {
        brandsData = data.brands || [];
        if(brandsData.length === 0){
          brandDetail.innerHTML = '<div class="gl-empty">등록된 브랜드가 없습니다.</div>';
          return;
        }
        // Rebuild every time (not just on first load) so a brand added via
        // "+ 브랜드 추가" shows up in the dropdown without a page refresh.
        brandSelect.innerHTML = '<option value="">브랜드를 선택하세요</option>';
        brandsData.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b.id;
          opt.textContent = b.name;
          brandSelect.appendChild(opt);
        });
        const wanted = selectId || currentBrandId;
        currentBrandId = (wanted && brandsData.some(b => b.id === wanted)) ? wanted : brandsData[0].id;
        brandSelect.value = currentBrandId;
        render();
      });
  }

  function addNewBrand(){
    const input = document.getElementById('newBrandInput');
    const statusEl = document.getElementById('brandAddStatus');
    const name = input.value.trim();
    if(!name){
      statusEl.textContent = '브랜드 이름을 입력해주세요.';
      statusEl.className = 'brand-add-status error';
      return;
    }
    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return; // cancelled the prompt

    statusEl.textContent = '추가하는 중…';
    statusEl.className = 'brand-add-status';

    fetch('/api/advertisers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, editPassword: password }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          statusEl.textContent = data.error || '추가에 실패했습니다.';
          statusEl.className = 'brand-add-status error';
          return;
        }
        input.value = '';
        statusEl.textContent = '"' + name + '" 브랜드가 추가됐습니다.';
        statusEl.className = 'brand-add-status ok';
        const newId = data.brand && data.brand.id;
        loadBrandsData(newId);
      })
      .catch(() => {
        statusEl.textContent = '추가 중 오류가 발생했습니다. 다시 시도해주세요.';
        statusEl.className = 'brand-add-status error';
      });
  }

  document.getElementById('addBrandBtn').addEventListener('click', addNewBrand);

  function deleteBrand(b){
    const warning = b.isCustom
      ? ('"' + b.name + '" 브랜드를 삭제할까요? 등록된 체크리스트·피드백 내용도 함께 사라집니다.')
      : ('"' + b.name + '" 브랜드를 목록에서 삭제할까요?' + (b.imageCount > 0 ? ' 등록된 참고 배너 ' + b.imageCount + '장은 보관되지만 더 이상 노출되지 않습니다.' : '') + ' (코드로 등록된 브랜드라 복원이 필요하면 Claude에게 요청해주세요)');
    if(!window.confirm(warning)) return;
    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return; // cancelled the prompt

    fetch('/api/advertisers', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: b.id, editPassword: password }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          window.alert(data.error || '삭제에 실패했습니다.');
          return;
        }
        currentBrandId = null;
        loadBrandsData();
      })
      .catch(() => {
        window.alert('삭제 중 오류가 발생했습니다. 다시 시도해주세요.');
      });
  }

  function loadChecklistOptions(){
    return fetch('/api/brandGuideChecklistOptions')
      .then(r => r.json())
      .then(data => { checklistOptions = data.items || []; });
  }

  Promise.all([loadChecklistOptions(), loadBrandsData()])
    .catch(() => {
      brandDetail.innerHTML = '<div class="gl-empty">브랜드 가이드를 불러오지 못했습니다. API가 배포되었는지 확인해주세요.</div>';
    });
</script>
</body>
</html>
