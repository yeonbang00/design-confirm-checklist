<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdCheck | 레퍼런스 축 일괄 태깅</title>
<link rel="icon" href="assets/favicon.png">
<!-- 개발용 도구. 큐레이션된 레퍼런스에 축 태그를 한 번 입힌다.
     끊겨도 이어서 할 수 있다. 저장된 것은 건너뛴다. -->
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0c0e;color:#edeef0;font:13px/1.6 Pretendard,-apple-system,sans-serif;padding:24px;letter-spacing:-.015em;max-width:920px}
h1{font-size:19px;margin:0 0 4px}
p.sub{color:#8b9099;font-size:12.5px;margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;font-weight:600;padding:9px 15px;border-radius:8px;border:1px solid #30343b;background:#14171c;color:#edeef0;cursor:pointer}
button.go{background:#c3ff4d;color:#10120c;border-color:#c3ff4d}
button.stop{border-color:#7a4a4a}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:8px;border-radius:5px;background:#1b1f25;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:#c3ff4d;width:0;transition:width .3s}
pre{font:11.5px/1.75 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#c7ccd4;background:#101317;border:1px solid #23272e;border-radius:10px;padding:14px;margin:0 0 14px}
.warn{border-color:#5a4a2a;background:#1a1710;color:#e8d9b0}
#fails{color:#ffb454;font-size:11.5px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>레퍼런스 축 일괄 태깅</h1>
<p class="sub">큐레이션 레퍼런스에 축 열둘을 입힌다. 한 장에 vision 호출 한 번이라 비용이 든다.<br>
   중간에 닫아도 된다. 다시 열면 저장된 것은 건너뛰고 남은 것만 이어서 한다.<br>
   <b>처음에는 50장으로 한 번 돌려 시간과 비용을 확인한 뒤 숫자를 올리세요.</b></p>

<pre id="state">상태를 확인하는 중…</pre>

<div class="row">
  <label>한 번에 <input id="cap" type="number" value="50" min="1" style="width:76px;font:inherit;padding:7px 9px;border-radius:7px;border:1px solid #424751;background:#0f1216;color:#edeef0"> 장까지</label>
  <button class="go" id="run" disabled>남은 것 태깅</button>
  <button class="stop" id="stop" disabled>멈추기</button>
  <button id="refresh">상태 새로고침</button>
</div>
<div class="bar"><i id="prog"></i></div>
<pre id="log">　</pre>
<div id="fails"></div>

<script type="module">
const $ = s => document.querySelector(s);
const CATS = ['beauty','shopping','telecom','fashion','finance','healthcare',
              'electronics','education','food','travel','realestate','gaming','automotive'];
const SAVE_EVERY = 25;   // 이만큼 모이면 중간 저장한다
const LANES = 4;         // 태깅 동시 실행 수
const BACKUP = 'adcheck.refAxes.backup';

/* 저장은 '지금까지 태깅한 전부'를 매번 통째로 보낸다.
   델타만 보내다가 952장 중 425장만 남은 적이 있다. 서버가 매니페스트를
   읽고 고쳐 쓰는데, 방금 쓴 내용이 아직 반영되기 전에 다음 요청이 읽으면
   그 사이 것이 통째로 사라진다. 클라이언트에서 순서를 지켜도 소용없다.
   읽는 쪽이 뒤처지는 문제라서다.
   전부를 보내면 어떤 순서로 끼어들어도 마지막 쓰기에 전부 들어 있다. */

let stopping = false, running = false;
let all = [], done = new Set();

async function getJSON(url, opt) {
  const r = await fetch(url, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
// 매니페스트 키는 서버와 같은 규칙이어야 한다 (api/_referenceAxesStore.js)
function axesKey(url) {
  const name = String(url || '').split('?')[0].split('/').pop() || '';
  const stem = name.replace(/\.[a-z0-9]+$/i, '');
  const tail = stem.split('-').pop();
  return tail && tail.length >= 8 ? tail : stem.slice(-40);
}

async function loadState() {
  $('#state').textContent = '상태를 확인하는 중…';
  const lists = await Promise.all(CATS.map(async (c) => {
    try { const d = await getJSON('/api/referenceImages?category=' + c);
      return (d.items || []).filter(x => x.thumbUrl).map(x => ({ ...x, category: c })); }
    catch { return []; }
  }));
  all = lists.flat();
  // 같은 이미지가 두 업종에 들어간 경우를 한 번만 센다
  const seen = new Set();
  all = all.filter(x => { const k = axesKey(x.thumbUrl); if (seen.has(k)) return false; seen.add(k); return true; });
  if (!all.length) {
    $('#state').className = 'warn';
    $('#state').textContent = '레퍼런스를 가져오지 못했습니다. 배포본에서 열어야 합니다. 로컬에는 /api가 없습니다.';
    $('#run').disabled = true;
    return [];
  }
  let saved;
  try { saved = await getJSON('/api/referenceAxes'); }
  catch (e) {
    $('#state').className = 'warn';
    $('#state').textContent = '저장된 축 태그를 읽지 못했습니다: ' + (e.message || e)
      + '\n배포본에서 열어야 합니다. 로컬에는 /api가 없습니다.';
    $('#run').disabled = true;
    return [];
  }
  done = new Set(Object.keys(saved.items || {}));
  const left = all.filter(x => !done.has(axesKey(x.thumbUrl)));
  const byCat = {};
  left.forEach(x => { byCat[x.category] = (byCat[x.category] || 0) + 1; });
  $('#state').className = '';
  $('#state').textContent =
    `전체 ${all.length}장 · 태깅됨 ${all.length - left.length} · 남음 ${left.length}\n`
    + (left.length ? '남은 업종  ' + Object.entries(byCat).map(([k, v]) => `${k} ${v}`).join(' · ') : '전부 끝났습니다.');
  $('#prog').style.width = (all.length ? (all.length - left.length) / all.length * 100 : 0) + '%';
  $('#run').disabled = !left.length && !results.size;
  return left;
}

const results = new Map();   // 이번 판에 태깅한 전부. 키는 thumbUrl.

let backupAt = 0;
function backup(force) {
  if (!force && results.size - backupAt < 10) return;
  backupAt = results.size;
  try { localStorage.setItem(BACKUP, JSON.stringify([...results])); } catch (e) { /* 용량 초과는 무시 */ }
}

async function save() {
  if (!results.size) return 0;
  const d = await getJSON('/api/referenceAxes', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ items: [...results].map(([url, axes]) => ({ url, axes })) }),
  });
  results.forEach((_, url) => done.add(axesKey(url)));
  return d.total || 0;
}

$('#run').onclick = async () => {
  if (running) return;
  running = true; stopping = false;
  $('#run').disabled = true; $('#stop').disabled = false; $('#refresh').disabled = true;
  const fails = [];
  try {
    let left = await loadState();
    const cap = Number($('#cap').value) || left.length;
    left = left.slice(0, cap);
    let i = 0, ok = 0, since = 0;
    const t0 = Date.now();

    const tick = () => {
      const per = ok ? (Date.now() - t0) / ok / 1000 : 0;
      const rest = Math.max(0, left.length - ok - fails.length);
      $('#log').textContent =
        `태깅 ${ok + fails.length} / ${left.length}  (성공 ${ok} · 실패 ${fails.length})\n`
        + `한 장당 ${per.toFixed(1)}초 · 남은 시간 약 ${Math.round(per * rest / 60)}분\n`
        + `이번 판 보관 ${results.size}건`;
      $('#prog').style.width = ((done.size + results.size) / all.length * 100) + '%';
    };

    // 저장은 직렬로. 매번 전부를 보내므로 순서가 어긋나도 내용이 사라지지 않는다.
    let saving = Promise.resolve();
    const flush = () => {
      since = 0;
      saving = saving.then(() => save()).catch(e => { fails.push('저장 실패: ' + e.message); });
      return saving;
    };

    const lane = async () => {
      while (i < left.length && !stopping) {
        const it = left[i++];
        try {
          const d = await getJSON('/api/analyzeReferenceImage', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: it.thumbUrl, brandName: it.brandName || '' }),
          });
          if (d.axes && Object.keys(d.axes).length) {
            results.set(it.thumbUrl, d.axes); ok++; since++; backup();
          } else { fails.push(`${it.brandName} · 축 없음`); }
        } catch (e) { fails.push(`${it.brandName} · ${String(e.message).slice(0, 50)}`); }
        if (since >= SAVE_EVERY) await flush();
        tick();
      }
    };
    await Promise.all(Array.from({ length: LANES }, lane));
    backup(true);
    await flush();
    await saving;

    /* 보낸 만큼 실제로 남았는지 다시 읽어 대조한다. 조용히 사라지는 일이
       한 번 있었으므로 확인 없이 끝났다고 말하지 않는다. */
    const check = await getJSON('/api/referenceAxes');
    const saved = new Set(Object.keys(check.items || {}));
    const missing = [...results.keys()].filter(u => !saved.has(axesKey(u)));
    $('#log').textContent += stopping ? '\n\n멈췄습니다.' : '\n\n끝났습니다.';
    $('#log').textContent += `\n보낸 ${results.size}건 중 저장 확인 ${results.size - missing.length}건`;
    if (missing.length) {
      $('#log').textContent += `\n\n${missing.length}건이 저장되지 않았습니다. 다시 돌리기를 누르면 그것만 재시도합니다.`;
    } else {
      try { localStorage.removeItem(BACKUP); } catch (e) { /* 없어도 그만 */ }
      results.clear();
    }
    if (fails.length) $('#fails').textContent = '실패 ' + fails.length + '건\n' + fails.slice(0, 40).join('\n');
  } catch (e) {
    $('#log').textContent += '\n오류: ' + (e.message || e);
  } finally {
    running = false; $('#stop').disabled = true; $('#refresh').disabled = false;
    await loadState();
  }
};
$('#stop').onclick = () => { stopping = true; $('#log').textContent += '\n멈추는 중… 진행 중인 것만 마칩니다.'; };
$('#refresh').onclick = () => loadState();

/* 창이 꺼져도 태깅한 것을 잃지 않는다. 한 장에 한 번씩 돈이 나가는 일이라
   다시 돌리는 비용이 그대로 비용이다. */
try {
  const b = JSON.parse(localStorage.getItem(BACKUP) || '[]');
  if (Array.isArray(b) && b.length) {
    b.forEach(([url, axes]) => results.set(url, axes));
    $('#log').textContent = `저장 못 한 ${results.size}건이 이 브라우저에 남아 있습니다. 돌리기를 누르면 먼저 저장합니다.`;
  }
} catch (e) { /* 백업이 깨졌으면 그냥 무시 */ }

loadState();
</script>
</body>
</html>
