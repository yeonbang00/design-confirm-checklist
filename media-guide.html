<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자인 히어로 | 매체 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(97.5% 0.006 85);
    --card: oklch(99.2% 0.002 85);
    --card-border: oklch(89% 0.015 265);
    --text: oklch(22% 0.02 265);
    --text-2: oklch(48% 0.02 265);
    --text-3: oklch(55% 0.015 265);
    --num-bg: oklch(93% 0.03 260);
    --num-text: oklch(35% 0.08 260);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--num-text); outline-offset:2px;}

  .page{max-width:820px; margin:0 auto; padding:40px 24px 100px;}
  .gnb-bar{display:flex; align-items:center; gap:20px; margin-bottom:40px; flex-wrap:wrap;}
  .gnb-logo{display:flex; align-items:center;}
  .gnb-logo img{height:20px; width:auto; display:block;}
  .gnb{display:flex; align-items:center; gap:0; flex-wrap:wrap;}
  .gnb-link{font-size:13.5px; font-weight:600; text-decoration:none; color:var(--text-3); transition:color .15s ease;}
  .gnb-link:hover{color:var(--text);}
  .gnb-link.active{color:var(--num-text);}
  .gnb-sep{color:var(--text-3); opacity:0.35; margin:0 12px; font-size:12px;}

  h1{font-size:30px; font-weight:700; letter-spacing:-0.01em; margin:0 0 10px;}
  .sub{font-size:14.5px; color:var(--text-2); line-height:1.8; margin:0 0 28px; max-width:560px;}

  .select-wrap{position:relative; margin-bottom:12px; max-width:420px;}
  .select-wrap select{
    width:100%; appearance:none; background:var(--card); border:1px solid oklch(84% 0.015 265);
    border-radius:10px; padding:13px 40px 13px 16px; font-size:14.5px; font-weight:600; color:var(--text); cursor:pointer;
  }
  .select-wrap svg{position:absolute; right:16px; top:50%; transform:translateY(-50%); pointer-events:none;}

  .media-add{max-width:420px; margin-bottom:28px;}
  .media-add-toggle{font-size:12.5px; font-weight:700; color:var(--num-text); background:none; border:none; cursor:pointer; padding:0; font-family:inherit;}
  .media-add-toggle:hover{opacity:0.8;}
  .media-add-form{display:none; flex-direction:column; gap:8px; margin-top:10px; padding:16px; border:1px solid var(--card-border); border-radius:12px; background:var(--card);}
  .media-add-form.show{display:flex;}
  .media-add-form input[type="text"], .media-add-form input[type="url"]{
    padding:10px 12px; border:1px solid oklch(84% 0.015 265); border-radius:8px; font-size:13px; font-family:inherit; background:var(--bg);
  }
  .media-add-form label{font-size:12px; color:var(--text-2); font-weight:600;}
  .media-add-btn{align-self:flex-start; border:none; background:var(--num-bg); color:var(--num-text); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit;}
  .media-add-btn:hover{opacity:0.85;}
  .media-add-status{font-size:12px; min-height:14px;}
  .media-add-status.error{color:var(--danger, #c0392b);}
  .media-add-status.ok{color:var(--ok, #2e7d32);}

  .brand-card{background:var(--card); border:1px solid var(--card-border); border-radius:20px; padding:32px;}
  .brand-head{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  .brand-name{font-size:19px; font-weight:700;}
  .brand-note{font-size:13px; color:var(--text-2); margin-bottom:20px;}
  .source-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .source-btn{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--num-text); background:var(--num-bg); border:none; border-radius:20px; padding:8px 14px; text-decoration:none; cursor:pointer; font-family:inherit;}
  .source-btn:hover{opacity:0.85;}
  .source-btn:disabled{opacity:0.6; cursor:default;}

  .spec-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:22px;}
  .spec-card{border:1.5px solid var(--num-text); border-radius:14px; padding:16px 18px; background:var(--num-bg);}
  .spec-card-title{font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px;}
  .spec-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px; padding:5px 0; border-bottom:1px solid oklch(100% 0 0 / 0.5);}
  .spec-row:last-child{border-bottom:none;}
  .spec-row-label{color:var(--text-2);}
  .spec-row-value{color:var(--text); font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}

  .gl-empty{font-size:13.5px; color:var(--text-3); background:oklch(96% 0.008 85); border-radius:10px; padding:16px 18px;}
  .gl-heading{font-size:13px; font-weight:700; color:var(--num-text); background:var(--num-bg); border-radius:8px; padding:8px 12px; margin:18px 0 10px;}
  .gl-heading:first-child{margin-top:0;}
  .gl-p{font-size:14px; line-height:1.8; color:var(--text); margin:0 0 12px;}
  .gl-list{margin:0 0 14px; padding-left:20px;}
  .gl-list li{font-size:14px; line-height:1.8; color:var(--text); margin-bottom:4px;}

  .page-footer{text-align:center; font-size:12px; color:var(--text-3); line-height:1.8; padding-top:28px;}

  .loading-msg{font-size:13.5px; color:var(--text-3); padding:20px 0;}

  @media (max-width:640px){
    .page{padding:28px 18px 70px;}
    .brand-card{padding:22px 20px;}
    .gnb-bar{gap:14px;}
    .gnb-sep{margin:0 8px;}
    .select-wrap{max-width:none;}
  }
</style>
</head>
<body>

<div class="page">
  <div class="gnb-bar">
    <a href="index.html" class="gnb-logo"><img src="https://oeiquwo26iglgctf.public.blob.vercel-storage.com/brand/logo-dark-aQv7KnQfdnikXjQX7xuwRqSxNvw7GG.png" alt="디자인 히어로"></a>
    <nav class="gnb">
      <a href="index.html" class="gnb-link">디자인 체크리스트</a><span class="gnb-sep">|</span>
      <a href="brief-helper.html" class="gnb-link">기획안 헬퍼</a><span class="gnb-sep">|</span>
      <a href="guide.html" class="gnb-link">브랜드 가이드</a><span class="gnb-sep">|</span>
      <a href="media-guide.html" class="gnb-link active">매체 가이드</a><span class="gnb-sep">|</span>
      <a href="reference-board.html" class="gnb-link">이미지 레퍼런스</a>
    </nav>
  </div>

  <h1>매체 가이드</h1>
  <p class="sub">매체 가이드 체크박스에 등록된 매체별 소재 등록 기준이에요. 배너를 분석할 때 AI가 참고하는 기준과 그대로 연결돼 있어요.</p>

  <div class="select-wrap">
    <select id="mediaSelect">
      <option value="">매체를 선택하세요</option>
    </select>
    <svg width="14" height="9" viewBox="0 0 14 9"><path d="M1 1L7 7L13 1" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </div>

  <div class="media-add">
    <button type="button" class="media-add-toggle" id="mediaAddToggle">+ 매체 추가</button>
    <div class="media-add-form" id="mediaAddForm">
      <label for="newMediaName">매체 이름</label>
      <input type="text" id="newMediaName" placeholder="예: 데이블">
      <label for="newMediaUrl">공식 가이드 URL (선택)</label>
      <input type="url" id="newMediaUrl" placeholder="https://...">
      <label for="newMediaFile">가이드 PDF 파일 (선택)</label>
      <input type="file" id="newMediaFile" accept="application/pdf">
      <button type="button" class="media-add-btn" id="addMediaBtn">추가</button>
      <div class="media-add-status" id="mediaAddStatus"></div>
    </div>
  </div>

  <div id="mediaDetail">
    <div class="loading-msg">매체 가이드를 불러오는 중…</div>
  </div>

  <div class="page-footer">
    이름/URL/PDF는 팀이 직접 등록할 수 있어요. 실제 사이즈·기준 내용을 채우려면 등록 후 Claude에게 자료를 보내주세요.
  </div>
</div>

<script>
  function escapeHtml(s){
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function renderLines(lines){
    const introLines = [];
    const listLines = [];
    let seenList = false;
    for(const l of lines){
      if(l.trim().startsWith('-')){ seenList = true; listLines.push(l); }
      else if(!seenList){ introLines.push(l); }
      else { listLines.push(l); }
    }
    let html = '';
    const intro = introLines.join(' ').trim();
    if(intro) html += '<p class="gl-p">' + escapeHtml(intro) + '</p>';
    if(listLines.length){
      html += '<ul class="gl-list">' + listLines.map(l =>
        '<li>' + escapeHtml(l.trim().replace(/^-\s*/, '')) + '</li>'
      ).join('') + '</ul>';
    }
    return html;
  }

  function formatGuideline(text){
    const paragraphs = text.split(/\n\n+/);
    return paragraphs.map(p => {
      const lines = p.split('\n');
      if(lines[0].trim().startsWith('[') && lines[0].trim().endsWith(']')){
        const header = lines[0].trim().slice(1, -1);
        return '<div class="gl-heading">' + escapeHtml(header) + '</div>' + renderLines(lines.slice(1));
      }
      return renderLines(lines);
    }).join('');
  }

  const mediaSelect = document.getElementById('mediaSelect');
  const mediaDetail = document.getElementById('mediaDetail');
  let mediaGuidesData = [];

  function renderMedia(id){
    const m = mediaGuidesData.find(x => x.id === id);
    if(!m){ mediaDetail.innerHTML = ''; return; }
    let bodyHtml;
    if(m.guideline && m.guideline.trim()){
      bodyHtml = formatGuideline(m.guideline);
    } else {
      bodyHtml = '<div class="gl-empty">아직 이 매체의 가이드가 등록되지 않았습니다.</div>';
    }

    let sourceHtml = '';
    if(m.sourceUrl || m.fileUrl){
      sourceHtml = '<div class="source-row">';
      if(m.sourceUrl){
        sourceHtml += '<a class="source-btn" href="' + escapeHtml(m.sourceUrl) + '" target="_blank" rel="noopener">공식 가이드 페이지 열기 ↗</a>';
      }
      if(m.fileUrl){
        sourceHtml += '<a class="source-btn" href="' + escapeHtml(m.fileUrl) + '" target="_blank" rel="noopener" download="' + escapeHtml(m.fileName || 'guide.pdf') + '">' + escapeHtml(m.fileName || 'PDF 다운로드') + ' ⬇</a>';
      }
      sourceHtml += '</div>';
    }

    let specHtml = '';
    if(m.specs && m.specs.length){
      specHtml = '<div class="spec-grid">' + m.specs.map(s => {
        let rows = '<div class="spec-row"><span class="spec-row-label">사이즈</span><span class="spec-row-value">' + escapeHtml(s.size || '—') + '</span></div>';
        if(s.format) rows += '<div class="spec-row"><span class="spec-row-label">파일형식</span><span class="spec-row-value">' + escapeHtml(s.format) + '</span></div>';
        if(s.maxSize) rows += '<div class="spec-row"><span class="spec-row-label">용량 제한</span><span class="spec-row-value">' + escapeHtml(s.maxSize) + '</span></div>';
        return '<div class="spec-card"><div class="spec-card-title">' + escapeHtml(s.label) + '</div>' + rows + '</div>';
      }).join('') + '</div>';
    }

    mediaDetail.innerHTML =
      '<div class="brand-card">' +
      '<div class="brand-head"><span class="brand-name">' + escapeHtml(m.name) + '</span></div>' +
      (m.note ? '<div class="brand-note">' + escapeHtml(m.note) + '</div>' : '') +
      sourceHtml +
      specHtml +
      bodyHtml +
      '</div>';
  }

  mediaSelect.addEventListener('change', () => {
    if(mediaSelect.value) renderMedia(mediaSelect.value);
    else mediaDetail.innerHTML = '';
  });

  function loadMediaGuidesData(selectId){
    return fetch('/api/mediaGuideDetails')
      .then(r => {
        if(!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(data => {
        mediaGuidesData = data.mediaGuides || [];
        if(mediaGuidesData.length === 0){
          mediaDetail.innerHTML = '<div class="gl-empty">등록된 매체가 없습니다.</div>';
          return;
        }
        // Rebuild every time (not just on first load) so a media guide
        // added via "+ 매체 추가" shows up in the dropdown right away.
        mediaSelect.innerHTML = '<option value="">매체를 선택하세요</option>';
        mediaGuidesData.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          mediaSelect.appendChild(opt);
        });
        const wanted = selectId || mediaSelect.value;
        const target = (wanted && mediaGuidesData.some(m => m.id === wanted)) ? wanted : mediaGuidesData[0].id;
        mediaSelect.value = target;
        renderMedia(target);
      })
      .catch(() => {
        mediaDetail.innerHTML = '<div class="gl-empty">매체 가이드를 불러오지 못했습니다. api/mediaGuideDetails.js가 배포되었는지 확인해주세요.</div>';
      });
  }

  const mediaAddToggle = document.getElementById('mediaAddToggle');
  const mediaAddForm = document.getElementById('mediaAddForm');
  mediaAddToggle.addEventListener('click', () => {
    mediaAddForm.classList.toggle('show');
  });

  function readFileAsBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        if(!base64){ reject(new Error('파일을 읽지 못했습니다.')); return; }
        resolve(base64);
      };
      reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('addMediaBtn').addEventListener('click', () => {
    const nameInput = document.getElementById('newMediaName');
    const urlInput = document.getElementById('newMediaUrl');
    const fileInput = document.getElementById('newMediaFile');
    const statusEl = document.getElementById('mediaAddStatus');

    const name = nameInput.value.trim();
    if(!name){
      statusEl.textContent = '매체 이름을 입력해주세요.';
      statusEl.className = 'media-add-status error';
      return;
    }

    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return; // cancelled the prompt

    statusEl.textContent = '추가하는 중…';
    statusEl.className = 'media-add-status';

    const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
    (file ? readFileAsBase64(file) : Promise.resolve(null))
      .then(fileBase64 => fetch('/api/mediaGuides', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          sourceUrl: urlInput.value.trim(),
          fileBase64,
          fileName: file ? file.name : undefined,
          editPassword: password,
        }),
      }))
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          statusEl.textContent = data.error || '추가에 실패했습니다.';
          statusEl.className = 'media-add-status error';
          return;
        }
        nameInput.value = '';
        urlInput.value = '';
        fileInput.value = '';
        statusEl.textContent = '"' + name + '" 매체가 추가됐습니다.';
        statusEl.className = 'media-add-status ok';
        const newId = data.mediaGuide && data.mediaGuide.id;
        loadMediaGuidesData(newId);
      })
      .catch(() => {
        statusEl.textContent = '추가 중 오류가 발생했습니다. 다시 시도해주세요.';
        statusEl.className = 'media-add-status error';
      });
  });

  loadMediaGuidesData();
</script>
</body>
</html>
