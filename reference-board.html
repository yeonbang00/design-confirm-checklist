<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdCheck | 이미지 레퍼런스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(97.5% 0.006 85);
    --card: oklch(99.2% 0.002 85);
    --card-border: oklch(89% 0.015 265);
    --text: oklch(22% 0.02 265);
    --text-2: oklch(48% 0.02 265);
    --text-3: oklch(55% 0.015 265);
    --num-bg: oklch(93% 0.03 260);
    --num-text: oklch(35% 0.08 260);
  }
  *{box-sizing:border-box;}
  html{scrollbar-gutter:stable;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
  }
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--num-text); outline-offset:2px;}

  .page{max-width:1040px; margin:0 auto; padding:40px 24px 100px;}
  .gnb-bar{position:sticky; top:0; background:var(--bg); z-index:100;}
  .gnb-bar-inner{display:flex; align-items:center; gap:40px; max-width:1040px; margin:0 auto; padding:10px 24px; flex-wrap:wrap;}
  .gnb-logo{display:flex; align-items:center;}
  .gnb-logo-text{font-size:17px; font-weight:800; color:var(--text); letter-spacing:-0.01em;}
  .gnb{display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
  .gnb-link{font-size:13.5px; font-weight:400; text-decoration:none; color:var(--text-3); transition:color .15s ease;}
  .gnb-link:hover{color:var(--text);}
  .gnb-link.active{color:var(--num-text); font-weight:700;}
  .gnb-dropdown{position:relative;}
  .gnb-dropdown-toggle{background:none; border:none; font-family:inherit; cursor:pointer; padding:0; display:flex; align-items:center; gap:4px;}
  .gnb-dropdown-toggle::after{content:'▾'; font-size:9px; margin-top:1px;}
  .gnb-dropdown-menu{position:absolute; top:100%; left:50%; transform:translateX(-50%); padding:14px; background:var(--bg); width:max-content; display:none; flex-direction:row; gap:20px; z-index:30;}
  .gnb-dropdown-menu.open{display:flex;}
  .gnb-dropdown:hover .gnb-dropdown-menu, .gnb-dropdown:focus-within .gnb-dropdown-menu{display:flex;}
  .gnb-dropdown-item{display:block; font-size:13.5px; text-decoration:none; white-space:nowrap; color:var(--text-3);}
  .gnb-dropdown-item:hover{color:var(--text);}
  .gnb-dropdown-item.active{color:var(--num-text); font-weight:700;}

  h1{font-size:30px; font-weight:700; letter-spacing:-0.01em; margin:0 0 10px;}
  .sub{font-size:14.5px; color:var(--text-2); line-height:1.8; margin:0 0 28px;}

  .card{border-radius:14px; box-shadow:6px 6px 18px oklch(20% 0.02 265 / 0.08); background:var(--card); padding:20px;}
  .card.coming-soon{background:oklch(98% 0.008 260); text-align:center;}
  .upload-coming-soon{margin-bottom:24px;}
  .coming-soon-icon{font-size:26px; margin-bottom:8px;}
  .coming-soon-badge{display:inline-block; font-size:11px; font-weight:700; color:var(--num-text); background:var(--num-bg); border-radius:20px; padding:4px 12px; margin-bottom:10px;}
  .coming-soon-text{font-size:13px; color:var(--text-3); line-height:1.7; max-width:480px; margin:0 auto;}

  .select-wrap{position:relative; margin-bottom:28px; max-width:420px;}
  .select-wrap select{
    width:100%; appearance:none; background:var(--card); border:1px solid oklch(84% 0.015 265);
    border-radius:10px; padding:13px 40px 13px 16px; font-size:14.5px; font-weight:600; color:var(--text); cursor:pointer;
  }
  .select-wrap svg{position:absolute; right:16px; top:50%; transform:translateY(-50%); pointer-events:none;}

  .loading-msg{font-size:13.5px; color:var(--text-3); padding:20px 0;}
  .gl-empty{font-size:13.5px; color:var(--text-3); background:oklch(96% 0.008 85); border-radius:10px; padding:20px 18px; line-height:1.7;}

  .brand-filter{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .filter-chip{font-size:12.5px; font-weight:600; color:var(--text-2); background:var(--card); border:1px solid oklch(84% 0.015 265); border-radius:20px; padding:6px 14px; cursor:pointer; font-family:inherit;}
  .filter-chip:hover{border-color:oklch(70% 0.02 265);}
  .filter-chip.active{color:var(--num-text); background:var(--num-bg); border-color:transparent;}

  .ref-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:16px;}
  .ref-item{border-radius:14px; overflow:hidden; box-shadow:6px 6px 18px oklch(20% 0.02 265 / 0.08); background:var(--card);}
  .ref-thumb{position:relative; display:block; width:100%; aspect-ratio:1; border:none; padding:0; margin:0; cursor:pointer; background:oklch(96% 0.008 85);}
  .ref-thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s ease;}
  .ref-thumb:hover img{transform:scale(1.04);}
  .nhn-badge{position:absolute; top:6px; right:6px; z-index:1; font-size:9px; font-weight:800; letter-spacing:0.03em; color:#fff; background:oklch(35% 0.08 260 / 0.9); padding:2.5px 7px; border-radius:5px; pointer-events:none; white-space:nowrap;}
  .ref-caption{padding:10px 12px 12px;}
  .ref-brand{font-size:13px; font-weight:700; color:var(--text); margin-bottom:2px;}
  .ref-note{font-size:12px; color:var(--text-2); line-height:1.5;}

  .page-footer{text-align:center; font-size:12px; color:var(--text-3); line-height:1.8; padding-top:28px;}

  .lightbox{display:none; position:fixed; inset:0; background:oklch(10% 0.01 265 / 0.85); z-index:100; align-items:center; justify-content:center; padding:40px;}
  .lightbox.show{display:flex;}
  .lightbox-inner{max-width:100%; max-height:100%; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .lightbox img{max-width:100%; max-height:75vh; border-radius:8px; box-shadow:0 20px 60px oklch(0% 0 0 / 0.4);}
  .lightbox img[src=""]{display:none;}
  .lightbox-caption{color:oklch(95% 0.004 85); font-size:13px; text-align:center;}
  .lightbox-close{position:absolute; top:24px; right:28px; background:none; border:none; color:#fff; font-size:32px; line-height:1; cursor:pointer; padding:8px;}

  @media (max-width:640px){
    .page{padding:28px 18px 70px;}
    .gnb-bar-inner{gap:12px;}
    .gnb{gap:12px;}
    .select-wrap{max-width:none;}
    .ref-grid{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px;}
  }
</style>
</head>
<body>

<div class="gnb-bar">
  <div class="gnb-bar-inner">
    <a href="index.html" class="gnb-logo"><span class="gnb-logo-text">AdCheck</span></a>
    <nav class="gnb">
      <a href="index.html" class="gnb-link">디자인 체크리스트</a>
      <a href="brief-helper.html" class="gnb-link">기획안 헬퍼</a>
      <div class="gnb-dropdown">
        <button type="button" class="gnb-link gnb-dropdown-toggle">가이드</button>
        <div class="gnb-dropdown-menu">
          <a href="guide.html" class="gnb-dropdown-item">브랜드가이드</a>
          <a href="media-guide.html" class="gnb-dropdown-item">매체가이드</a>
          <a href="color-guide.html" class="gnb-dropdown-item">컬러가이드</a>
        </div>
      </div>
      <a href="reference-board.html" class="gnb-link active">이미지 레퍼런스</a>
      <a href="history.html" class="gnb-link">히스토리</a>
      <a href="roadmap.html" class="gnb-link">업데이트 예정</a>
    </nav>
  </div>
</div>

<div class="page">

  <h1>이미지 레퍼런스</h1>
  <p class="sub">업종별로 경쟁사 이미지와 팀이 직접 제작한 소재를 함께 모아두는 공간입니다. 팀이 제작한 소재는 카드 우측 상단에 <strong>NHN AD</strong> 표시가 붙습니다.</p>

  <div class="card coming-soon upload-coming-soon">
    <div class="coming-soon-icon">🖼️</div>
    <div class="coming-soon-badge">업데이트 예정</div>
    <div class="coming-soon-text">이 사이트를 이용하는 팀원이 직접 이미지를 등록할 수 있는 기능이에요.<br>유료 플랜 결제 후 업데이트 예정입니다.</div>
  </div>

  <div class="select-wrap">
    <select id="categorySelect">
      <option value="">카테고리를 선택하세요</option>
    </select>
    <svg width="14" height="9" viewBox="0 0 14 9"><path d="M1 1L7 7L13 1" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </div>

  <div id="refContent">
    <div class="loading-msg">카테고리를 불러오는 중…</div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="닫기">&times;</button>
  <div class="lightbox-inner">
    <img id="lightboxImg" src="" alt="확대된 레퍼런스 이미지">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script>
  document.querySelectorAll('.gnb-dropdown-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = btn.nextElementSibling;
      document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxClose = document.getElementById('lightboxClose');

  function openLightbox(fullSrc, caption){
    lightboxCaption.textContent = caption || '';
    lightbox.classList.add('show');
    lightboxImg.src = fullSrc;
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

  const categorySelect = document.getElementById('categorySelect');
  const refContent = document.getElementById('refContent');
  let categoriesData = [];
  let currentCategoryId = null;

  function loadCategoryImages(id, name){
    currentCategoryId = id;
    refContent.innerHTML = '<div class="loading-msg">레퍼런스를 불러오는 중…</div>';
    fetch('/api/referenceImages?category=' + encodeURIComponent(id))
      .then(r => {
        if(!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(data => {
        if(currentCategoryId !== id) return; // switched categories mid-fetch
        const items = data.items || [];
        if(items.length === 0){
          refContent.innerHTML = '<div class="gl-empty">아직 "' + escapeHtml(name) + '" 카테고리에 등록된 레퍼런스가 없습니다.<br>이미지를 보내주시면 추가해드려요.</div>';
          return;
        }

        refContent.innerHTML = '';

        const brands = [...new Set(items.map(it => it.brandName).filter(Boolean))];
        if(brands.length > 1){
          const filterBar = document.createElement('div');
          filterBar.className = 'brand-filter';
          const allChip = document.createElement('button');
          allChip.type = 'button';
          allChip.className = 'filter-chip active';
          allChip.textContent = '전체';
          allChip.dataset.brand = '';
          filterBar.appendChild(allChip);
          brands.forEach(b => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'filter-chip';
            chip.textContent = b;
            chip.dataset.brand = b;
            filterBar.appendChild(chip);
          });
          filterBar.addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if(!chip) return;
            filterBar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            const brand = chip.dataset.brand;
            grid.querySelectorAll('.ref-item').forEach(el => {
              el.style.display = (!brand || el.dataset.brand === brand) ? '' : 'none';
            });
          });
          refContent.appendChild(filterBar);
        }

        const grid = document.createElement('div');
        grid.className = 'ref-grid';
        items.forEach((item, i) => {
          const caption = (item.brandName || '') + (item.note ? ' · ' + item.note : '');
          const wrap = document.createElement('div');
          wrap.className = 'ref-item';
          wrap.dataset.brand = item.brandName || '';
          const thumbBtn = document.createElement('button');
          thumbBtn.type = 'button';
          thumbBtn.className = 'ref-thumb';
          thumbBtn.innerHTML = '<img src="' + item.thumbUrl + '" alt="' + escapeHtml(item.brandName || '레퍼런스') + '" loading="lazy">' +
            (item.ownWork ? '<span class="nhn-badge">NHN AD</span>' : '');
          thumbBtn.addEventListener('click', () => openLightbox(item.fullUrl, caption));
          wrap.appendChild(thumbBtn);
          const capDiv = document.createElement('div');
          capDiv.className = 'ref-caption';
          capDiv.innerHTML = (item.brandName ? '<div class="ref-brand">' + escapeHtml(item.brandName) + '</div>' : '') +
            (item.note ? '<div class="ref-note">' + escapeHtml(item.note) + '</div>' : '');
          wrap.appendChild(capDiv);
          grid.appendChild(wrap);
        });
        refContent.appendChild(grid);
      })
      .catch(() => {
        if(currentCategoryId !== id) return;
        refContent.innerHTML = '<div class="gl-empty">레퍼런스를 불러오지 못했습니다. api/referenceImages.js가 배포되었는지 확인해주세요.</div>';
      });
  }

  categorySelect.addEventListener('change', () => {
    if(!categorySelect.value){ currentCategoryId = null; refContent.innerHTML = ''; return; }
    const cat = categoriesData.find(c => c.id === categorySelect.value);
    loadCategoryImages(categorySelect.value, cat ? cat.name : '');
  });

  fetch('/api/referenceCategories')
    .then(r => {
      if(!r.ok) throw new Error('status ' + r.status);
      return r.json();
    })
    .then(data => {
      categoriesData = data.categories || [];
      if(categoriesData.length === 0){
        refContent.innerHTML = '<div class="gl-empty">등록된 카테고리가 없습니다.</div>';
        return;
      }
      categoriesData.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name + ' (' + c.count + ')';
        categorySelect.appendChild(opt);
      });
      refContent.innerHTML = '<div class="gl-empty">위에서 카테고리를 선택하면 레퍼런스가 보여요.</div>';
    })
    .catch(() => {
      refContent.innerHTML = '<div class="gl-empty">카테고리를 불러오지 못했습니다. api/referenceCategories.js가 배포되었는지 확인해주세요.</div>';
    });
</script>
</body>
</html>
