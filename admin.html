<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdCheck | 관리자</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0C0E;
    --surface: #14171C;
    --surface-2: #0F1216;
    --surface-3: #15181D;
    --line: rgba(255,255,255,.11);
    --line-soft: rgba(255,255,255,.07);
    --ink: #EDEEF0;
    --ink-2: #A2A7B0;
    --ink-3: #7E838C;
    --ink-4: #6B707A;
    --accent: #C3FF4D;
    --accent-strong: #B8E600;
    --accent-ink: #0B0C0E;
    --card: #14171C;
    --card-border: rgba(255,255,255,.11);
    --text: #EDEEF0;
    --text-2: #A2A7B0;
    --text-3: #7E838C;
    --canvas-text: #EDEEF0;
    --canvas-text-2: #A2A7B0;
    --charcoal: #15181D;
    --charcoal-border: rgba(255,255,255,.11);
    --num-bg: rgba(204,255,0,.1);
    --num-text: #CCFF00;
    --pass: #00A371;
    --needsfix: #F7A900;
    --reject: #F22F6B;
    --na: #6B707A;
    --danger: #C2687A;
    --ok: #A8CFBC;
    --font-display: 'Sora','Pretendard',sans-serif;
    --font-mono: 'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  /* 첫 페인트 전부터 숨겨서 반짝임(FOUC) 방지 — adcheck-reveal.js가 이후 트랜지션을 붙인다.
     자바스크립트가 죽어도 콘텐츠가 영영 안 보이는 사고가 없도록 noscript로 되돌린다. */
  [data-row],[data-reveal]{opacity:0;}

  html{scrollbar-gutter:stable;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-x:hidden;
  }
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button,input,select,textarea{font-family:inherit;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  .grain{position:fixed; inset:0; z-index:600; pointer-events:none; background-image:url(assets/grain.svg); background-size:180px 180px; opacity:.09; mix-blend-mode:overlay;}

  .page{max-width:1180px; margin:0 auto; padding:120px 40px 100px;}

  .gnb-bar{position:fixed; top:0; left:0; right:0; z-index:200; padding:14px 40px 0; background:linear-gradient(180deg,#0B0C0E 74%,rgba(11,12,14,.86)); backdrop-filter:blur(10px);}
  .gnb-bar-inner{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; max-width:1520px; margin:0 auto; gap:20px;}
  .gnb-logo{display:flex; align-items:center; justify-self:start; text-decoration:none;}
  .gnb-logo-icon{height:40px; width:auto; display:block;}
  .gnb-logo-text{display:none;}
  .gnb{display:flex; align-items:center;}
  .gnb-primary{gap:2px; justify-self:center; padding:6px; border-radius:999px; background:rgba(18,21,25,.9); backdrop-filter:blur(18px) saturate(1.2); border:1px solid rgba(255,255,255,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -26px rgba(0,0,0,.95);}
  .gnb-secondary{gap:2px; justify-self:end;}
  .gnb-primary .gnb-link{font-size:13px; font-weight:500; color:var(--ink-2); padding:9px 15px; border-radius:999px; text-decoration:none; letter-spacing:-.015em; white-space:nowrap; border:none; background:none; cursor:pointer; transition:background .25s ease,color .25s ease,box-shadow .25s ease;}
  .gnb-primary .gnb-link:hover{color:var(--ink); box-shadow:inset 0 0 0 1px rgba(204,255,0,.55);}
  .gnb-primary .gnb-link.active{background:#EDEEF0; color:#0B0C0E; font-weight:700;}
  .gnb-primary .gnb-link.active:hover{box-shadow:none;}
  .gnb-secondary .gnb-link{font-size:12.5px; font-weight:500; color:var(--ink-3); padding:9px 12px; text-decoration:none; white-space:nowrap; transition:color .25s ease;}
  .gnb-secondary .gnb-link:hover{color:var(--ink);}
  .gnb-secondary .gnb-link.active{color:#EDEEF0;}
  .gnb-dropdown{position:relative;}
  .gnb-dropdown-toggle{display:flex; align-items:center; gap:5px; font-family:inherit;}
  .gnb-dropdown-toggle::after{content:'\25BC'; font-size:8px; opacity:.55;}
  .gnb-dropdown-menu{position:absolute; top:100%; left:50%; transform:translateX(-50%); padding-top:12px; display:none; z-index:40;}
  .gnb-dropdown-menu-inner{padding:8px; border-radius:16px; background:rgba(20,23,28,.98); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.14); box-shadow:0 26px 54px -20px rgba(0,0,0,.95); min-width:158px; display:flex; flex-direction:column; gap:2px;}
  .gnb-dropdown:hover .gnb-dropdown-menu, .gnb-dropdown:focus-within .gnb-dropdown-menu, .gnb-dropdown-menu.open{display:block;}
  .gnb-dropdown-item{display:block; width:100%; text-align:left; font-size:12.5px; font-weight:500; color:var(--ink-2); padding:10px 12px; border-radius:9px; white-space:nowrap; text-decoration:none; transition:background .2s ease,color .2s ease;}
  .gnb-dropdown-item:hover{color:var(--ink); background:rgba(255,255,255,.07);}
  .gnb-dropdown-item.active{color:var(--accent); background:rgba(204,255,0,.1);}



  /* ---------- 푸터 로고 ---------- */
  .footer-logo{display:block; height:36px; width:auto; margin:0 auto 18px; opacity:.5;}

  .page-eyebrow{font:500 11px/1 var(--font-mono); letter-spacing:.2em; color:var(--ink-3); margin-bottom:22px;}
  .page-eyebrow b{color:var(--accent); font-weight:500;}
  h1{font-family:var(--font-display); font-size:clamp(36px,4.6vw,68px); font-weight:800; letter-spacing:-.055em; line-height:1; margin:0; color:var(--ink);}
  .sub{margin:24px 0 44px; max-width:78ch; font-size:16.5px; font-weight:300; line-height:1.85; color:var(--ink-2);}

  .gate-card{background:var(--card); box-shadow:none; border:1px solid rgba(255,255,255,.11); border-radius:16px; padding:28px; max-width:340px;}
  .gate-card input{width:100%; padding:12px 14px; border:1px solid var(--card-border); border-radius:10px; font-size:14px; box-sizing:border-box; margin-bottom:12px; font-family:inherit;}
  .gate-card button{width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
  .gate-err{color:var(--danger); font-size:12.5px; margin:-4px 0 12px;}

  .section{display:none; margin-top:32px;}
  .section.show{display:block;}
  .section-title{font-size:14px; font-weight:700; color:var(--text-2); margin:0 0 14px;}
  .user-row{background:var(--card); box-shadow:none; border:1px solid rgba(255,255,255,.11); border-radius:14px; padding:16px 18px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .user-info{font-size:13.5px;}
  .user-name{font-weight:700; margin-right:6px;}
  .user-email{color:var(--text-2);}
  .user-date{font-size:12px; color:var(--text-3); margin-top:2px;}
  .user-actions{display:flex; gap:8px; flex-shrink:0;}
  .btn{padding:8px 14px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;}
  .btn-approve{background:var(--ok); color:var(--surface);}
  .btn-reject{background:var(--danger); color:var(--surface);}
  .btn-revoke{background:rgba(255,255,255,.14); color:var(--text);}
  .empty{font-size:13px; color:var(--text-3); padding:16px 0;}
  .status-line{font-size:12.5px; color:var(--danger); margin-top:12px; min-height:14px;}
</style>
</head>
<body>
<noscript><style>[data-row],[data-reveal]{opacity:1 !important;}</style></noscript>

<div class="grain"></div>
<div class="page">
  <div class="page-eyebrow"><b>&#10022;</b>&nbsp;ADMIN</div>
  <h1>AdCheck 관리자</h1>
  <p class="sub">가입 신청 승인/거절 및 계정 관리 페이지입니다.</p>

  <div class="gate-card" id="gateCard">
    <input type="password" id="adminPassword" placeholder="관리자 비밀번호" autofocus>
    <button type="button" id="unlockBtn">확인</button>
    <div class="gate-err" id="gateErr"></div>
  </div>

  <button type="button" class="btn btn-revoke" id="refreshBtn" style="display:none; margin-bottom:8px;">새로고침</button>

  <div class="section" id="pendingSection">
    <div class="section-title">승인 대기</div>
    <div id="pendingList"></div>
  </div>

  <div class="section" id="approvedSection">
    <div class="section-title">승인됨</div>
    <div id="approvedList"></div>
  </div>

  <div class="section" id="rejectedSection">
    <div class="section-title">거절됨</div>
    <div id="rejectedList"></div>
  </div>

  <div class="status-line" id="statusLine"></div>
</div>

<script>
  function escapeHtml(s){
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  let adminPassword = '';
  const gateCard = document.getElementById('gateCard');
  const gateErr = document.getElementById('gateErr');
  const pendingSection = document.getElementById('pendingSection');
  const approvedSection = document.getElementById('approvedSection');
  const rejectedSection = document.getElementById('rejectedSection');
  const pendingList = document.getElementById('pendingList');
  const approvedList = document.getElementById('approvedList');
  const rejectedList = document.getElementById('rejectedList');
  const statusLine = document.getElementById('statusLine');
  const refreshBtn = document.getElementById('refreshBtn');

  let currentUsers = [];

  function formatDate(iso){
    if(!iso) return '';
    return iso.slice(0, 10);
  }

  function renderUsers(users){
    const pending = users.filter(u => u.status === 'pending');
    const approved = users.filter(u => u.status === 'approved');
    const rejected = users.filter(u => u.status === 'rejected');

    pendingList.innerHTML = pending.length ? pending.map(u =>
      '<div class="user-row">' +
        '<div class="user-info"><span class="user-name">' + escapeHtml(u.name) + '</span><span class="user-email">' + escapeHtml(u.email) + '</span>' +
        '<div class="user-date">신청일 ' + formatDate(u.createdAt) + '</div></div>' +
        '<div class="user-actions">' +
          '<button type="button" class="btn btn-approve" data-id="' + escapeHtml(u.id) + '" data-action="approve">승인</button>' +
          '<button type="button" class="btn btn-reject" data-id="' + escapeHtml(u.id) + '" data-action="reject">거절</button>' +
        '</div></div>'
    ).join('') : '<div class="empty">대기 중인 신청이 없습니다.</div>';

    approvedList.innerHTML = approved.length ? approved.map(u =>
      '<div class="user-row">' +
        '<div class="user-info"><span class="user-name">' + escapeHtml(u.name) + '</span><span class="user-email">' + escapeHtml(u.email) + '</span>' +
        '<div class="user-date">승인일 ' + formatDate(u.approvedAt) + '</div></div>' +
        '<div class="user-actions">' +
          '<button type="button" class="btn btn-revoke" data-id="' + escapeHtml(u.id) + '" data-action="revoke">권한 해제</button>' +
        '</div></div>'
    ).join('') : '<div class="empty">승인된 사용자가 없습니다.</div>';

    rejectedList.innerHTML = rejected.length ? rejected.map(u =>
      '<div class="user-row">' +
        '<div class="user-info"><span class="user-name">' + escapeHtml(u.name) + '</span><span class="user-email">' + escapeHtml(u.email) + '</span></div>' +
        '<div class="user-actions">' +
          '<button type="button" class="btn btn-approve" data-id="' + escapeHtml(u.id) + '" data-action="approve">승인으로 전환</button>' +
        '</div></div>'
    ).join('') : '<div class="empty">거절된 사용자가 없습니다.</div>';
  }

  async function loadUsers(){
    statusLine.textContent = '';
    try{
      const response = await fetch('/_gate/admin/pending', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword })
      });
      const data = await response.json();
      if(!response.ok){
        gateErr.textContent = data.error || '비밀번호가 올바르지 않습니다.';
        return false;
      }
      gateCard.style.display = 'none';
      pendingSection.classList.add('show');
      approvedSection.classList.add('show');
      rejectedSection.classList.add('show');
      refreshBtn.style.display = '';
      currentUsers = data.users || [];
      renderUsers(currentUsers);
      return true;
    }catch(err){
      gateErr.textContent = '서버에 연결하지 못했습니다.';
      return false;
    }
  }

  document.getElementById('unlockBtn').addEventListener('click', async () => {
    adminPassword = document.getElementById('adminPassword').value;
    gateErr.textContent = '';
    await loadUsers();
  });

  refreshBtn.addEventListener('click', () => { loadUsers(); });

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.btn[data-action]');
    if(!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    btn.disabled = true;
    statusLine.textContent = '';
    try{
      const response = await fetch('/_gate/admin/decide', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword, userId: id, action })
      });
      const data = await response.json();
      if(!response.ok){
        statusLine.textContent = data.error || '처리에 실패했습니다.';
        btn.disabled = false;
        return;
      }
      // 방금 처리한 결과를 직접 로컬 상태에 반영해서 즉시 다시 그림 —
      // 서버(Blob storage)에 방금 쓴 내용을 곧바로 다시 읽으면 캐시
      // 지연으로 옛날 상태가 보일 수 있어서, 재조회 대신 이렇게 처리.
      const user = currentUsers.find((u) => u.id === id);
      if(user){
        if(action === 'approve'){
          user.status = 'approved';
          user.approvedAt = new Date().toISOString();
        } else {
          user.status = 'rejected';
          user.approvedAt = null;
        }
      }
      renderUsers(currentUsers);
    }catch(err){
      statusLine.textContent = '서버에 연결하지 못했습니다.';
      btn.disabled = false;
    }
  });
</script>
<script src="assets/adcheck-reveal.js?v=7"></script>
</body>
</html>
