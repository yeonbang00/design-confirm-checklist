<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdCheck | 히스토리</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0C0E;
    --surface: #14171C;
    --surface-2: #0F1216;
    --surface-3: #15181D;
    --line: rgba(255,255,255,.11);
    --line-soft: rgba(255,255,255,.07);
    --ink: #EDEEF0;
    --ink-2: #A2A7B0;
    --ink-3: #7E838C;
    --ink-4: #6B707A;
    --accent: #CCFF00;
    --accent-strong: #B8E600;
    --accent-ink: #0B0C0E;
    --card: #14171C;
    --card-border: rgba(255,255,255,.11);
    --text: #EDEEF0;
    --text-2: #A2A7B0;
    --text-3: #7E838C;
    --canvas-text: #EDEEF0;
    --canvas-text-2: #A2A7B0;
    --charcoal: #15181D;
    --charcoal-border: rgba(255,255,255,.11);
    --num-bg: rgba(204,255,0,.1);
    --num-text: #CCFF00;
    --pass: #A8CFBC;
    --needsfix: #D9A660;
    --reject: #C2687A;
    --na: #6B707A;
    --danger: #C2687A;
    --ok: #A8CFBC;
    --font-display: 'Sora','Pretendard',sans-serif;
    --font-mono: 'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  /* 첫 페인트 전부터 숨겨서 반짝임(FOUC) 방지 — adcheck-reveal.js가 이후 트랜지션을 붙인다.
     자바스크립트가 죽어도 콘텐츠가 영영 안 보이는 사고가 없도록 noscript로 되돌린다. */
  [data-row],[data-reveal]{opacity:0;}

  html{scrollbar-gutter:stable;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-x:hidden;
  }
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button,input,select,textarea{font-family:inherit;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  .grain{position:fixed; inset:0; z-index:600; pointer-events:none; background-image:url(assets/grain.svg); background-size:180px 180px; opacity:.09; mix-blend-mode:overlay;}

  .page{max-width:1180px; margin:0 auto; padding:120px 40px 100px;}

  .gnb-bar{position:fixed; top:0; left:0; right:0; z-index:200; padding:14px 40px 0; background:linear-gradient(180deg,#0B0C0E 74%,rgba(11,12,14,.86)); backdrop-filter:blur(10px);}
  .gnb-bar-inner{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; max-width:1520px; margin:0 auto; gap:20px;}
  .gnb-logo{display:flex; align-items:center; justify-self:start; text-decoration:none;}
  .gnb-logo-icon{height:40px; width:auto; display:block;}
  .gnb-logo-text{display:none;}
  .gnb{display:flex; align-items:center;}
  .gnb-primary{gap:2px; justify-self:center; padding:6px; border-radius:999px; background:rgba(18,21,25,.9); backdrop-filter:blur(18px) saturate(1.2); border:1px solid rgba(255,255,255,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -26px rgba(0,0,0,.95);}
  .gnb-secondary{gap:2px; justify-self:end;}
  .gnb-primary .gnb-link{font-size:13px; font-weight:500; color:var(--ink-2); padding:9px 15px; border-radius:999px; text-decoration:none; letter-spacing:-.015em; white-space:nowrap; border:none; background:none; cursor:pointer; transition:background .25s ease,color .25s ease,box-shadow .25s ease;}
  .gnb-primary .gnb-link:hover{color:var(--ink); box-shadow:inset 0 0 0 1px rgba(204,255,0,.55);}
  .gnb-primary .gnb-link.active{background:#EDEEF0; color:#0B0C0E; font-weight:700;}
  .gnb-primary .gnb-link.active:hover{box-shadow:none;}
  .gnb-secondary .gnb-link{font-size:12.5px; font-weight:500; color:var(--ink-3); padding:9px 12px; text-decoration:none; white-space:nowrap; transition:color .25s ease;}
  .gnb-secondary .gnb-link:hover{color:var(--ink);}
  .gnb-secondary .gnb-link.active{color:#EDEEF0;}
  .gnb-dropdown{position:relative;}
  .gnb-dropdown-toggle{display:flex; align-items:center; gap:5px; font-family:inherit;}
  .gnb-dropdown-toggle::after{content:'\25BC'; font-size:8px; opacity:.55;}
  .gnb-dropdown-menu{position:absolute; top:100%; left:50%; transform:translateX(-50%); padding-top:12px; display:none; z-index:40;}
  .gnb-dropdown-menu-inner{padding:8px; border-radius:16px; background:rgba(20,23,28,.98); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.14); box-shadow:0 26px 54px -20px rgba(0,0,0,.95); min-width:158px; display:flex; flex-direction:column; gap:2px;}
  .gnb-dropdown:hover .gnb-dropdown-menu, .gnb-dropdown:focus-within .gnb-dropdown-menu, .gnb-dropdown-menu.open{display:block;}
  .gnb-dropdown-item{display:block; width:100%; text-align:left; font-size:12.5px; font-weight:500; color:var(--ink-2); padding:10px 12px; border-radius:9px; white-space:nowrap; text-decoration:none; transition:background .2s ease,color .2s ease;}
  .gnb-dropdown-item:hover{color:var(--ink); background:rgba(255,255,255,.07);}
  .gnb-dropdown-item.active{color:var(--accent); background:rgba(204,255,0,.1);}

  .scroll-progress{max-width:1520px; margin:14px auto 0; height:1px; background:rgba(255,255,255,.07); border-radius:1px; overflow:hidden;}
  .scroll-progress-bar{height:1px; width:0%; background:linear-gradient(90deg,var(--accent),var(--ink));}



  /* ---------- 푸터 로고 ---------- */
  .page-footer{text-align:center; font:400 11.5px/1.9 'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; letter-spacing:normal; color:var(--ink-4); padding-top:60px; margin-top:80px; border-top:1px solid var(--line-soft);}
  .footer-logo{display:block; height:36px; width:auto; margin:0 auto 18px; opacity:.5;}

  .page-eyebrow{font:500 11px/1 var(--font-mono); letter-spacing:.2em; color:var(--ink-3); margin-bottom:22px;}
  .page-eyebrow b{color:var(--accent); font-weight:500;}
  h1{font-family:var(--font-display); font-size:clamp(36px,4.6vw,68px); font-weight:800; letter-spacing:-.055em; line-height:1; margin:0; color:var(--ink);}
  .sub{margin:24px 0 44px; max-width:78ch; font-size:16.5px; font-weight:300; line-height:1.85; color:var(--ink-2);}

  .loading-msg{font-size:13.5px; color:var(--text-3); padding:20px 0;}
  .gl-empty{font-size:13.5px; color:var(--text-3); background:rgba(255,255,255,.045); border-radius:10px; padding:20px 18px; line-height:1.7;}

  .history-list{position:relative; padding-left:26px;}
  .history-list::before{content:''; position:absolute; left:5px; top:8px; bottom:8px; width:1px; background:var(--line);}
  .history-item{position:relative; padding:0 0 34px 0;}
  .history-item::before{content:''; position:absolute; left:-25px; top:7px; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(204,255,0,.12);}
  .history-item:last-child{padding-bottom:0;}
  .history-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:9px;}
  .history-date{font:700 11.5px/1 var(--font-mono); letter-spacing:.1em; color:var(--accent);}
  .history-category{font:600 10px/1 var(--font-mono); letter-spacing:.1em; color:var(--ink-3); border:1px solid var(--line); border-radius:6px; padding:5px 8px;}
  .history-title{font-family:var(--font-display); font-size:17px; font-weight:700; letter-spacing:-.03em; color:var(--ink); margin-bottom:8px;}
  .history-desc{font-size:13.5px; font-weight:300; line-height:1.8; color:var(--ink-2);}
  .history-main{flex:1; min-width:0;}
  .history-item{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
  .history-delete{flex-shrink:0; width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink-3); font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s ease,color .2s ease,border-color .2s ease;}
  .history-delete:hover{background:rgba(194,104,122,.13); border-color:rgba(194,104,122,.4); color:var(--reject);}

  @media (max-width:640px){
    .page{padding:28px 18px 70px;}
    .gnb-bar-inner{display:flex; flex-wrap:wrap; gap:16px;}
    .gnb{gap:12px;}
    .history-item{flex-direction:column;}
    .history-delete{align-self:flex-end;}
  }
</style>
</head>
<body>
<noscript><style>[data-row],[data-reveal]{opacity:1 !important;}</style></noscript>

<div class="grain"></div>

<div class="gnb-bar">
  <div class="gnb-bar-inner">
    <a href="index.html" class="gnb-logo"><img src="assets/logo-wordmark.png" alt="AdCheck" class="gnb-logo-icon"><span class="gnb-logo-text">AdCheck</span></a>
    <nav class="gnb gnb-primary">
      <a href="index.html" class="gnb-link">디자인 체크리스트</a>
      <div class="gnb-dropdown">
        <button type="button" class="gnb-link gnb-dropdown-toggle">가이드</button>
        <div class="gnb-dropdown-menu"><div class="gnb-dropdown-menu-inner">
          <a href="criteria-guide.html" class="gnb-dropdown-item">항목가이드</a>
          <a href="guide.html" class="gnb-dropdown-item">브랜드가이드</a>
          <a href="media-guide.html" class="gnb-dropdown-item">매체가이드</a>
          <a href="color-guide.html" class="gnb-dropdown-item">컬러가이드</a>
        </div></div>
      </div>
      <a href="brief-helper.html" class="gnb-link">기획안 헬퍼</a>
      <a href="font-pairing.html" class="gnb-link">폰트 페어링</a>
      <a href="reference-board.html" class="gnb-link">이미지 레퍼런스</a>
      </nav>
      <nav class="gnb gnb-secondary">
        <a href="history.html" class="gnb-link active">히스토리</a>
      <a href="roadmap.html" class="gnb-link">로드맵</a>
    </nav>
  </div>
  <div class="scroll-progress"><div class="scroll-progress-bar" id="scrollProgress"></div></div>
</div>

<div class="page">

  <div class="page-eyebrow"><b>&#10022;</b>&nbsp;CHANGELOG</div>

  <h1>히스토리</h1>
  <p class="sub">체크리스트 판정 로직, 브랜드·매체 가이드 등 실질적인 업데이트 내역입니다.</p>

  <div id="historyList">
    <div class="loading-msg">히스토리를 불러오는 중…</div>
  </div>
  <div class="page-footer show" data-reveal>
    <img src="assets/logo-wordmark.png" alt="AdCheck" class="footer-logo">
    최종 컨펌 여부는 리뷰어가 직접 확인하고 조정해주세요.<br>
    이 결과는 법적 효력이 없으며, 이로 인해 발생하는 문제에 대해 어떠한 책임도 지지 않습니다.<br>
    &copy; 2026 NHNAD. All rights reserved.
  </div>
</div>

<script>
  document.querySelectorAll('.gnb-dropdown-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = btn.nextElementSibling;
      document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') document.querySelectorAll('.gnb-dropdown-menu.open').forEach(m => m.classList.remove('open'));
  });

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function formatDate(iso){
    const d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
  }

  const historyList = document.getElementById('historyList');

  function render(entries){
    if(entries.length === 0){
      historyList.innerHTML = '<div class="gl-empty">아직 등록된 히스토리가 없습니다.</div>';
      return;
    }
    historyList.innerHTML = '<div class="history-list" data-stagger="down">' + entries.map(e =>
      '<div class="history-item" data-row data-id="' + escapeHtml(e.id) + '">' +
        '<div class="history-main">' +
          '<div class="history-top">' +
            '<span class="history-date">' + escapeHtml(formatDate(e.date)) + '</span>' +
            '<span class="history-category">' + escapeHtml(e.category) + '</span>' +
          '</div>' +
          '<div class="history-desc" title="' + escapeHtml(e.description) + '">' + escapeHtml(e.description) + '</div>' +
        '</div>' +
        '<button type="button" class="history-delete" data-id="' + escapeHtml(e.id) + '" aria-label="삭제">&times;</button>' +
      '</div>'
    ).join('') + '</div>';
    if(window.adcheckReveal) window.adcheckReveal();
  }

  function loadHistory(){
    return fetch('/api/referenceCategories?feed=history')
      .then(r => {
        if(!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(data => render(data.entries || []))
      .catch(() => {
        historyList.innerHTML = '<div class="gl-empty">히스토리를 불러오지 못했습니다. api/referenceCategories.js가 배포되었는지 확인해주세요.</div>';
      });
  }

  historyList.addEventListener('click', (e) => {
    const btn = e.target.closest('.history-delete');
    if(!btn) return;
    const id = btn.dataset.id;
    if(!window.confirm('이 히스토리 항목을 삭제할까요?')) return;
    const password = window.prompt('편집 비밀번호를 입력하세요');
    if(password === null) return;

    btn.disabled = true; btn.style.opacity = '.4';

    fetch('/api/referenceCategories', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, editPassword: password }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if(!ok){
          window.alert(data.error || '삭제에 실패했습니다.');
          btn.disabled = false; btn.style.opacity = '';
          return;
        }
        loadHistory();
      })
      .catch(() => {
        window.alert('삭제 중 오류가 발생했습니다. 다시 시도해주세요.');
        btn.disabled = false; btn.style.opacity = '';
      });
  });

  loadHistory();

  // 헤더 하단 스크롤 진행 바
  (function(){
    const bar = document.getElementById('scrollProgress');
    if(!bar) return;
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>
<script src="assets/adcheck-reveal.js"></script>
</body>
</html>
