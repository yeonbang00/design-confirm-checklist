,calc(.5 + var(--scrim,.44)*.6)),transparent 65%)}.art.bottom-right{color:white}.art.bottom-right .copy{left:auto;right:7%;text-align:right;max-width:74%}.art.bottom-right:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,19,25,calc(.35 + var(--scrim,.52)*.65)),transparent 65%)}.art.bottom-right .cta{background:#faf8ee;color:#171a17}.art.original:after,.art.original .copy,.art.original .brand{display:none}.art.original>img{width:100%;height:100%;inset:0;object-fit:contain}.editor{position:sticky;top:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-height:calc(100vh - 40px);overflow:auto}.editor h2{font-size:18px}.editor .field{margin-top:12px}.editor .field input,.editor .field select,.editor .field textarea{font-size:13px}.editor .check{margin-top:12px;font-size:12px}.editor-actions{display:grid;gap:8px;margin-top:16px}.empty{padding:64px 24px;text-align:center;border:1px dashed #424751;border-radius:12px}.saved-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.saved-entry{border-bottom:1px solid var(--line);padding-bottom:20px}.saved-entry .row{margin-top:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 20px;border:1px solid #69744f;background:#252e19;color:#f4ffe4;z-index:50;border-radius:8px;font-size:13px;box-shadow:0 10px 40px #0007}.workflow-note{max-width:65ch}.error{color:#ffd3a4;font-size:13px}.library-count{color:var(--lime)}.footer{color:var(--muted);font-size:12px;padding-top:42px}.mode-tabs{display:flex;gap:8px;margin:20px 0}.mode-tabs button{font-size:12px}.selected-info{font-size:12px;color:var(--lime)}.skeleton-free{animation:arrive .28s ease-out}@keyframes arrive{from{transform:translateY(5px)}to{transform:translateY(0)}}@media(min-width:1500px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1100px){.directions{grid-template-columns:repeat(3,minmax(0,1fr))}.wo <link rel="stylesheet" href="/assets/banner-studio-preview.css?a=6">
<link rel="stylesheet" href="/assets/banner-studio-live.css?a=8">
<style>
body{background:#0b0c0e;padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:1100px}
</style>
<div class="grid" id="g"></div><pre id="o" style="font:11px/1.5 monospace;white-space:pre-wrap;margin-top:12px;color:#edeef0"></pre>
<script type="module">
const L=['header','offer','split','split-right','band','price','top-center','top-left','bottom-right','boxed','strip','numeral','corner','badge','type-diagonal','framed','duo-panel','arch'];
const img='/assets/banner-demo/concept-cafe.jpg';
document.getElementById('g').innerHTML=L.map(k=>`<div class="art ${k}"><img src="${img}"><span class="brand">설화수</span>
<div class="copy"><span class="eyebrow">임상 결과</span><span class="headline">오늘의 무드,\n무엇으로 채울까?</span><span class="subline">단단한 빛과 그림자 사이</span>
<strong class="offer-value">130,000원</strong><span class="cta">제품 자세히 보기</span><span class="benefit-condition">롯데카드 결제 시</span><span class="footnote">인체적용시험 · (주)마리디엠 피부과학연구소 · 2025.04.14~04.18</span></div></div>`).join('');
await new Promise(r=>setTimeout(r,600));
const rows=L.map((k,i)=>{
 const art=document.querySelectorAll('.art')[i], a=art.getBoundingClientRect();
 const pick=sel=>{const el=art.querySelector(sel);
  if(!el||getComputedStyle(el).display==='none')return null;
  const r=el.getBoundingClientRect(); if(!r.width)return null;
  return {sel,size:parseFloat(getComputedStyle(el).fontSize),top:r.top-a.top,bottom:r.bottom-a.top,left:r.left-a.left,abs:getComputedStyle(el).position==='absolute'};};
 const all=['.eyebrow','.headline','.offer-value','.subline','.benefit-condition','.cta','.brand','.footnote'].map(pick).filter(Boolean);
 const sizes=all.map(x=>x.size).sort((x,y)=>y-x);
 const ratio=sizes.length>1?sizes[0]/sizes[1]:0;
 /* 절대배치로 따로 앉힌 것은 본문 줄기가 아니다. 회전된 브랜드 마크나
    구석에 박은 숫자를 줄기에 넣으면 없는 간격 문제가 잡힌다. */
 const col=all.filter(x=>!x.abs&&x.left<a.width*0.7).sort((x,y)=>x.top-y.top);
 const stack=[]; for(const it of col){const p=stack[stack.length-1]; if(!p||it.top>=p.bottom-2)stack.push(it);}
 const g=[]; for(let j=1;j<stack.length;j++)g.push(stack[j].top-stack[j-1].bottom);
 const med=g.length?[...g].sort((x,y)=>x-y)[Math.floor(g.length/2)]:0;
 const border=Math.max(med*1.6,a.height*0.03);
 const chunks=1+g.filter(v=>v>border).length;
 const inner=g.filter(v=>v<=border);
 const gapDev=inner.length>1?Math.round(Math.max(...inner)-Math.min(...inner)):0;
 const c=pick('.cta'); const ctaH=c?(c.bottom-c.top)/a.height*100:0;
 return {k,비율:+ratio.toFixed(2),덩어리:chunks,CTA:+ctaH.toFixed(1),간격편차:gapDev,
  큰둘:sizes.slice(0,2).map(v=>+v.toFixed(1)).join('/'),
  위반:[ratio<1.25?'위계'+ratio.toFixed(2):'',chunks>3?'덩어리'+chunks:'',ctaH&&ctaH<4?'CTA'+ctaH.toFixed(1):'',gapDev>18?'간격'+gapDev:''].filter(Boolean)};
});
document.getElementById('o').textContent=rows.map(r=>`${r.k.padEnd(14)} 비율 ${String(r.비율).padEnd(5)} (${r.큰둘.padEnd(11)}) 덩어리 ${r.덩어리} CTA ${String(r.CTA).padEnd(5)} 간격 ${String(r.간격편차).padEnd(4)} ${r.위반.length?'✗ '+r.위반.join(', '):'✓'}`).join('\n')
 +`\n\n위반 ${rows.filter(r=>r.위반.length).length} / ${rows.length}`;
</script>
